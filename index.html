kych sériách, ktoré sprostredkúvajú mestské horizonty/mestské krajiny z rôznych pohľadov.","Triptych <em>Horizon</em> zachytáva rozľahlosť krajiny z vtáčej perspektívy, kde sa svetlo stretáva s tichom. Žiarivý horizont sa rozvíja do hlbokých vrstiev atmosféry – vízia vzdušnosti a pominuteľnosti, vznášajúca sa v jase.","V maľbe <em>Factory</em> zachytáva krajinu, v ktorej sa fragmenty priemyselných prvkov strácajú v rozľahlosti horizontu a rozpúšťajú sa vo svetelnom opare. Kompozícii dominujú monumentálne oblaky, pričom svetlo vystupuje do popredia ako ústredný zdroj fascinácie.","V <em>Lightscape</em> autor vychádza z dlhodobého skúmania mestských nočných scenérií a predstavuje tiché pokračovanie – postupný prechod od temnoty k jasu."],"refs":["https://danispeter.sk/. Odkaz nájdený 15. 10. 2026."]}},"Richard Marco":{"en":{"head":"Richard Marco (1994)","bio":["Marco studied at the Academy of Fine Arts and Design in Bratislava (2015–2021), under Professors Daniel Fischer and Ivan Csudai. His painting draws on the techniques of the Old Masters, which he unsettles through interventions such as stains and glazes of oil or solvent. He frequently brings lost or damaged historical works back into view.","The paintings in The Seven Sleepers series draw on an early Christian legend in which seven young Christians – soldiers or noblemen in some versions – refused to make sacrifices to pagan gods. They fled Ephesus and hid in a cave on Mount Celion. The emperor ordered the cave to be sealed, yet rather than starve, the seven fell asleep for centuries. The Seven Sleepers forms part of a broader series of so-called nocturnal paintings, including Queen of the Night Margaret of Brabant, followed by portraits of Matthias Corvinus and his wife Beatrix, titled Day in Love with Night and Night in Love with Day. These are portraits whose original likenesses were almost destroyed and whose surviving representations are therefore fictitious or illusory, or funerary monuments that preserve the subject’s appearance almost by force. Marco is drawn to the notion of a work “rising after the night”: something terrible has happened to it, or it was created in strange, painful circumstances. The series explores historical archetypes – king, saint, pope, child, knight, artist and burgher.","The Seven Sleepers No. 1 – Saint Hedwig: Her likeness was lost entirely, while her tomb was repeatedly moved or destroyed. The image by which she is now known was created only in 1902 by the sculptor Antoni Madeyski; this is the version represented in the exhibition.","The Seven Sleepers No. 2 – Henry II of France: During the French Revolution, the royal tombs were ransacked and the rulers’ remains, including Henry’s, were thrown into communal pits. Although the funerary monument itself survived, it stands empty.","The Seven Sleepers No. 3 – Pope Clement VI: In 1562, during the Wars of Religion, Huguenots looted and desecrated the tomb. The pope’s remains were burnt and scattered; only his skull survived and was later returned to the tomb. The monument was damaged again during the French Revolution, leaving only a fragment of its original medieval splendour. A damaged recumbent effigy survives from the original tomb and is depicted in the exhibition.","The Seven Sleepers No. 4 – Robert Manners: The boy died tragically at the age of nine following a sudden abdominal illness. His memorial was created by his mother, Violet, Duchess of Rutland, a gifted artist who worked on it for more than thirty years as a way of coming to terms with the loss of her beloved son."],"refs":["https://www.instagram.com/_marcori/ (accessed 29 October 2026)."]},"sk":{"head":"Richard Marco (1994)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave (2015 – 2021) pod vedením prof. Daniela Fischera a prof. Ivana Csudaia. Vo svojej tvorbe používa postupy starých majstrov, ktoré ozvláštňuje/narúša rôznymi zásahmi (fľaky, lazúry od oleja či riedidla). Často oživuje stratené alebo poškodené historické diela.","Maľby z cyklu <em>Sedmospáči</em> vychádzajú zo starokresťanskej legendy, keď sedem mladých kresťanov (v niektorých verziách vojaci alebo šľachtici) odmietlo prinášať obete pohanským bohom. Rozhodli sa ujsť z mesta Efez a ukryli sa v jaskyni na hore Celion. V nej ich dal cisár zamurovať, no oni neumreli od hladu, ale zaspali na stovky rokov. Cyklus <em>Sedmospáči</em> patrí do širšieho cyklu tzv. nočných obrazov (Kráľovná noci Margaréta Brabantská, potom nasledujú portréty Mateja Korvína a jeho manželky Beatrix ako Ďeň zaľúbený do noci a Noc zaľúbená do dňa). Všetko sú to umelecké portréty, ktoré boli buď takmer zničené a znázorňujú nepravdivú, iluzívnu podobu, alebo sú to hroby, ktoré zachovali podobu zobrazovaného akoby „nasilu“. Marco sa sústreďuje na príbeh, keď „dielo vstáva po noci“ – stalo sa mu buď niečo zlé, alebo vzniklo zvláštne (boľavo). V tomto cykle maliar pracuje s historickými archetypmi: kráľ, svätica, pápež, dieťa, rytier, umelec, mešťan.","Sedmospáč č.1 – Svätá Hedviga: Jej podoba sa úplne stratila a jej hrob sa veľakrát presúval alebo zanikal. Podoba, ktorú má, dostala od sochára Antoniho Madeyskiho až v roku 1902 (na výstave).","Sedmospáč č. 2 – Henrich II. Francúzsky: Počas Veľkej francúzskej revolúcie boli kráľovské hrobky vyplienené a pozostatky panovníkov (vrátane Henricha) boli vyhodené do spoločných jám. Hoci samotná umelecká hrobka prežila, je prázdna.","Sedmospáč č. 3 – Pápež Klement VI.: V roku 1562 počas náboženských vojen hrobku vydrancovali a znesvätili hugenoti. Pápežove pozostatky boli spálené a rozmetané, zachovala sa len lebka, ktorá bola neskôr vrátená do hrobky. Počas Francúzskej revolúcie bol pamätník opäť poškodený, preto dnes vidíme len torzo jeho pôvodnej stredovekej krásy. Z originálnej hrobky sa zachovala poškodená náhrobná socha (na výstave).","Sedmospáč č. 4 – Robert Manners: Chlapec zomrel tragicky ako deväťročný na náhle ochorenie brucha. Pamätník vytvorila jeho matka Violet, vojvodkyňa z Rutlandu, ktorá bola talentovanou umelkyňou. Na pôvodnom diele pracovala vyše 30 rokov, aby sa vyrovnala so stratou milovaného syna."],"refs":["https://www.instagram.com/_marcori/. Odkaz nájdený 29. 10. 2026."]}},"Robert Bielik":{"en":{"head":"Robert Bielik (1963)","bio":["A poet, prose writer and painter, Bielik studied at the Academy of Fine Arts and Design in Bratislava from 1987 to 1993, in Professor Rudolf Sikora’s Open Studio. He worked as an assistant lecturer in the Department of Art Education and Creative Practice at the Faculty of Education, Constantine the Philosopher University in Nitra. He has illustrated several books and published collections of poetry, prose and essays. Alongside painting and writing, he is an enthusiastic traveller.","Robert Bielik pursues his own artistic path, independently of prevailing currents in the art world. His work enters into a technical dialogue with historical painting, often taking photographs as its point of departure. He portrays people of personal significance while also confronting death, the moments preceding it and the process of coming to terms with mortality, seeking a release from the paradox of finitude and infinity. In his depictions of seas, forests, animals and familiar figures, he evokes a quiet tension characteristic of the human condition. Conscious of life’s transience, Bielik acknowledges it openly in his paintings. For him, painting becomes a form of meditation on impermanence. His imagined, sometimes hypothetically absurd scenarios – visual explorations of “what if?” – both fascinate and provoke. His practice brings realist representation into dialogue with symbolism and philosophical questions concerning human existence."],"refs":["JANČÁR, Ivan. Robert Bielik. Bratislava: Galéria mesta Bratislavy / Petrus, 2012. ISBN 978-80-89233-56-4.","https://nitrianskagaleria.sk/robert-bielik-chlapec-a-lebky/ (accessed 19 October 2026)."]},"sk":{"head":"Robert Bielik (1963)","bio":["Básnik, prozaik, maliar vyštudoval Vysokú školu výtvarných umení v Bratislave 1987 – 1993 (V Otvorenom ateliéri prof. Rudolfa Sikoru). Pôsobil ako odborný asistent na Katedre výtvarnej tvorby a výchovy Pedagogickej fakulty Univerzity Konštantína Filozofa v Nitre. Ilustroval viaceré knihy. Vydal niekoľko zbierok poézie, prozaické texty a eseje. Popri maľovaní a písaní rád cestuje.","Robert Bielik žije vlastný (umelecký) život nezávisle od nálad výtvarnej scény. Vedie technologický dialóg s historickou maľbou, v ktorej vychádza z fotografických predlôh. Zobrazuje ľudí, ktorí majú v jeho živote dôležité miesto, ale pripomína aj smrť (a predsmrtné okamihy) či vyrovnávanie sa s ňou, oslobodzuje sa od (ne)konečnosti. V zobrazeniach morí, lesov, zvierat a známych osobností dokáže namaľovať tiché napätie, také príznačné pre človeka. Maliar si uvedomuje konečnosť a verejne ju vo svojich maľbách priznáva. Maľovanie je pre neho prostriedok meditácie nad pominuteľnosťou. Vysnené, hypoteticky absurdné maliarove simulácie, v zmysle, čo by bolo keby, fascinujú, poburujú. Jeho tvorba spája realistické zobrazenia so symbolikou a filozofickými otázkami o ľudskej existencii."],"refs":["JANČÁR, Ivan. <em>Robert Bielik</em>. 2012, Bratislava: Galéria mesta Bratislavy. Petrus, ISBN 978-80-89233-56-4.","https://nitrianskagaleria.sk/robert-bielik-chlapec-a-lebky/. Odkaz nájdený 19. 10. 2026."]}},"Roman Hrčka":{"en":{"head":"Roman Hrčka (1980)","bio":["Hrčka studied in the Sculpture and Space studio under Professor Jozef Jankovič at the Academy of Fine Arts and Design in Bratislava (1999–2005). He completed doctoral studies at the Slovak University of Technology (2007–2010) and teaches at the Josef Vydra School of Applied Arts in Bratislava.","His practice encompasses figurative painting and often realist depictions of the human body. His works have both humanist and ecological dimensions. Notable public commissions include the statue of Ľudovít Winter in Piešťany and Bent Rail in Nové Zámky. Moving gradually beyond figurative realism, he developed realist torsos and simplified gestures that frequently carry a specific thematic charge. His works can be found in public spaces in Slovakia and the Czech Republic. In 2006 he received the Grand Prix at the Biennial of Fine Art organised for members of the Slovak Fine Artists’ Union.","The sculptural installation Cages of Solitude depicts individuals inhabiting their own intimate universes, confined within their “own boxes”, enclosed in isolation and inwardness. It conveys an urgent existential message about people who, under the oppressive pressures of the outside world, retreat into themselves. Over time, the work has acquired another resonance in relation to emerging technologies: it can also suggest a humanoid robot awaiting its purchaser, packaged as a commodity. The more humanity surrounds itself with new technologies, the further it moves from nature and the lonelier it becomes.","The sculptural installation Fragments of Humanity addresses ecology and war. Its principal formal elements are plaster casts of PET plastic bottles, altered to resemble bombs falling to earth. Fragments of two pairs of legs form part of the installation; they crush these “plaster bombs”, transforming them into crumpled plastic bottles of the kind so often found discarded outdoors. The title points to the traces humanity leaves behind – traces that, regrettably, speak not always of humanism, but also of destruction and waste."],"refs":["http://resculpture.sk/katalog-autorov/roman-hrcka/roman-hrcka/ (accessed 19 October 2026)."]},"sk":{"head":"Roman Hrčka (1980)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave v ateliéri Socha a priestor pod vedením prof. J. Jankoviča (1999 – 2005). Doktorandské štúdium dokončil na Slovenskej technickej univerzite (2007 – 2010). Pedagogicky pôsobí na Škole úžitkového výtvarníctva Josefa Vydru v Bratislave.","Vo svojej tvorbe sa venuje figurálnemu maliarstvu, často realisticky stvárňuje ľudské telo. Jeho realizácie majú humanistický i ekologický rozmer. Medzi jeho významné realizácie patrí <em>Socha Ľudovíta Wintera</em> v Pieštanoch či <em>Pokrčená koľaj</em> v Nových Zámkoch. Od figurálneho realizmu sa postupne prepracoval k realistickým torzám či zjednodušeným gestám, ktoré sú často nositeľom konkrétnej témy. Jeho diela sa nachádzajú vo verejnom priestore doma i v ČR. V roku 2006 získal Grand prix Bienále voľného výtvarného umenia (členov SVÚ).","Sochárska inštalácia s názvom <em>Klietky samoty</em> predstavuje jedincov, ktorí prežívajú vo vlastnom intímnom vesmíre – vo svojej „vlastnej krabici“ –, uzavretí do svojho vnútra, samoty a intimity. Dielo sa snaží odovzdať divákovi nástojčivý existenciálny odkaz pocitov mnohých dnešných existencií, ktoré sa pod ťaživým vplyvom vonkajšieho sveta radšej uzatvárajú do seba. Dielo má však s odstupom času aj inú, novú konotáciu, ktorá súvisí so súčasnými trendmi vo vývoji nových technológií. Z tohto pohľadu môže tiež evokovať humanoidného robota, ktorý čaká na svojho zákazníka ako tovar pripravený v krabici. Čím viac sa človek obklopuje novými technológiami, tým viac sa vzďaľuje prírode a stáva sa osamelým.","Sochárska inštalácia s názvom <em>Fragmenty ľudskosti</em> pracuje s témou ekológie a vojny. Hlavným tvaroslovným prvkom sú sadrové odliatky pet fliaš, ktoré sú tvarovo pozmenené tak, aby zároveň pripomínali bomby dopadajúce na zem. Súčasťou inštalácie sú aj fragmenty dvoch párov nôh. Tie deformujú predmetné „sadrové bomby“ a menia ich na pokrčené plastové fľaše, tak ako sme ich často vídali v exteriéri len tak pohodené medzi odpadkami. A preto má dielo názov <em>Fragmenty ľudskosti</em>, lebo človek často po sebe necháva stopy, ktoré, žiaľ, nie vždy priamo súvisia s humanizmom, ale so skazou a s odpadom."],"refs":["http://resculpture.sk/katalog-autorov/roman-hrcka/roman-hrcka/. Odkaz nájdený 19. 10. 2026."]}},"Roman Rembovský":{"en":{"head":"Roman Rembovský (1977)","bio":["He studied in Ján Berger’s studio at the Department of Painting and Other Media at the Academy of Fine Arts and Design in Bratislava. He completed his doctoral studies in the Studio of Classical Painting Disciplines, led by Professor Ľudovít Hološka, at the Academy of Arts in Banská Bystrica.","The four paintings selected for the exhibition – In the Garden of Eden, In the Silence, Mud 2 and Mud 3 – allow visitors to experience the urgency of his visual language. In the Garden of Eden depicts a female nude in an intimate, almost dreamlike setting. The work’s pronounced eroticism arises above all from the figure’s relaxed pose, the openness of the nude and the way the female body is modelled through soft light and flowing contours. Yet its erotic charge is far from gratuitous: it is interwoven with motifs drawn from nature and the traditional symbolism of the Garden of Eden. Red apples, luxuriant vegetation and decorative floral ornamentation evoke an atmosphere of sensuality, pleasure and a sense of prohibition. The contrast between the realistically rendered body and its stylised, ornamental surroundings reinforces the impression of an imaginary space in which naturalness and corporeality become central concerns. The painting thus presents the female nude not only as an aesthetic subject but also as a symbol of eroticism, desire, embodiment and humanity’s relationship with nature.","In In the Silence, stillness and the sense of suspended time are crucial. The contrasting symbols of a white rose and a black raven heighten the tension: the calm before the storm?","The landscape paintings, concerned specifically with mud, appeal directly to human emotions.","Rembovský’s pictorial language is characterised by tension, doubt and existential anxiety, conveyed through a strong sense of narrative. Through painting, he interrogates humanity and its possible absence. Figurative realism lies at the heart of his practice, but he enriches it with numerous allegories and metaphors that bring human vulnerability into sharper focus."],"refs":["https://www.artmajeur.com/en/magazine/8-meet-and-discover/roman-rembovsky-between-realism-and-conceptual-universe/339187 (accessed 29 September 2026).","https://www.saatchiart.com/en-sk/account/profile/1001674 (accessed 30 September 2026)."]},"sk":{"head":"Roman Rembovský (1977)","bio":["Študoval na Katedre maľby a iných médií v ateliéri Jána Bergera na VŠVU. Doktorandské štúdium ukončil na Katedre maľby v ateliéri klasických maliarskych disciplín prof. Ľudovíta Hološku na Akadémii umení v Banskej Bystrici.","Vo vybranej štvorici malieb (<em>V rajskej záhrade, V tichosti, Blato 2, 3</em>) má návštevník možnosť pocítiť naliehavosť jeho vizuálneho jazyka. Obraz <em>V rajskej záhrade</em> pracuje s motívom ženského aktu zasadeného do intímneho, takmer snového prostredia. Výrazná erotickosť diela vychádza predovšetkým z uvoľnenej polohy postavy, otvorenosti aktu a spôsobu, akým je ženské telo modelované mäkkým svetlom a plynulou kresbou. Erotický náboj však nepôsobí prvoplánovo, ale je prepojený s motívom prírody a tradičnou symbolikou rajskej záhrady. Červené jablká, bujná vegetácia a dekoratívny florálny ornament vytvárajú atmosféru zmyselnosti, pôžitku a určitého zákazu. Kontrast medzi realisticky podaným telom a štylizovaným, ornamentálnym prostredím posilňuje dojem imaginárneho priestoru, v ktorom sa prirodzenosť a telesnosť stávajú hlavnou témou. Dielo tak interpretuje ženský akt nielen ako estetický objekt, ale aj ako symbol erotiky, túžby, telesnosti a spojenia človeka s prírodou.","V maľbe <em>V tichosti</em> je dôležitá strnulosť a pocit zastavenia času, kontrasty symbolov bielej ruže a čierneho havrana dotvárajú napätie – ticho pred búrkou?","Maľby krajiny, konkrétne blata, apelujú na ľudské emócie.","Pre maliarsky jazyk Romana Rembovského je príznačné napätie, pochybnosti, existenciálna úzkosť s výrazným dejom. Cez maľby vyjednáva o ľudskosti a jej (ne)existencii. Ťažiskom jeho tvorby je figuratívny realizmus, ale obohacuje ho o nespočetné alegórie a metafory, čím ešte viac vyniká zraniteľnosť jedinca/človeka."],"refs":["https://www.artmajeur.com/en/magazine/8-meet-and-discover/roman-rembovsky-between-realism-and-conceptual-universe/339187. Odkaz nájdený 29. 9. 2026.","https://www.saatchiart.com/en-sk/account/profile/1001674. Odkaz nájdený 30. 9. 2026."]}},"Uľjana Zmetáková":{"en":{"head":"Uľjana Zmetáková (1951–2025)","bio":["Uľjana Zmetáková was an important exponent of photorealist painting. The daughter of the artist and collector Ernest Zmeták, she studied at the Academy of Fine Arts and Design in Bratislava (1972–1977) under Ladislav Čemický and subsequently in Professor Orest Dubay’s book illustration department. Her practice extended well beyond painting to encompass printmaking, drawing, illustration and textile art. Although she often depicted recognisable scenes of everyday life, the investigation of light — its refraction, reflection and shadows — remained central to her work.","‘The tendency towards photorealism emerged in Slovak art in the early 1970s, during the onset of Normalisation, when the relative freedoms of the 1960s gave way to a renewed insistence on the so-called creative method of Socialist Realism. Since Socialist Realism had never been precisely defined in theoretical terms, certain “deviations” drawing on modernist principles were permitted, among them photorealism. In its commitment to realist representation, photorealism formally satisfied Marxist theory; more problematic was the loss of individual authorship or the cool detachment from the subject characteristic of its American counterpart.’","The three works selected for this exhibition intensify a nostalgic longing for the future: a yearning for places that once existed but can never be quite the same again. Her paintings appear as archival documents of their time."],"refs":["JABLONSKÁ, Beata. ‘Lži, dilemy a alternatívy obrazu’. In: HRABUŠICKÝ, Aurel (ed.), Slovenské vizuálne umenie 1970–1985. Exhibition catalogue. Bratislava: Slovak National Gallery, 2002, p. 74.","VAŠKOVIČOVÁ, Hana. Uľjana Zmetáková. Bratislava: Tatran, 1990.","https://nitrianskagaleria.sk/uljana-zmetakova-zrkadlenie-iii-a-iv/. Accessed 29 October 2026."]},"sk":{"head":"Uľjana Zmetáková (1951 – 2025)","bio":["Uľjana Zmetáková bola dôležitou predstaviteľkou fotorealistickej maľby. Bola dcérou umelca a zberateľa Ernesta Zmetáka. Študovala na Vysokej škole výtvarných umení v Bratislave (1972 – 1977) pod vedením Ladislava Čemického, neskôr pokračovala na oddelení knižnej ilustrácie pod vedením prof. Oresta Dubaya. Jej umelecký záber sa nesústreďoval len na médium maľby, pohybovala sa suverénne aj na poli grafiky, kresby, ilustrácie či textilnej tvorby. I keď autorka často zachytávala reálne civilistické témy, dôležitým aspektom jej tvorby bolo skúmanie svetla, jeho lom, odraz a tieň. „Tendencia fotorealizmu sa v slovenskom umení objavila začiatkom 70. rokov, teda v období nástupu normalizácie, kedy sa po uvoľnených 60. rokoch opäť striktne vyžadovalo presadzovanie tzv. tvorivej metódy socialistického realizmu. Keďže pojem socialistický realizmus nebol v teórii presne definovaný, dovoľovali sa i určité „odchýlky“, čerpajúce z modernistických princípov, medzi ktorými bol i fotorealizmus. Ten síce marxistickej teórii formálne vyhovoval, a to svojím zakotvením v realistickom zobrazení, problematickým bola skôr strata autorstva alebo chladný odstup od námetu, badateľný v americkom prúde fotorealizmu.“","Trojica vybraných diel na výstave umocňuje nostalgický pocit po budúcnosti, túžbu po miestach, ktoré boli, ale už nikdy nebudú ako predtým... Pretože jej diela pôsobia ako archívne dokumenty doby."],"refs":["JABLONSKÁ, Beata: <em>Lži, dilemy a alternatívy obrazu</em>. In: HRABUŠICKÝ, Aurel (ed.): Slovenské vizuálne umenie 1970 – 1985. [Kat. výst.] Slovenská národná galéria: Bratislava, 2002, s. 74.","VAŠKOVIČOVÁ, Hana: <em>Uľjana Zmetáková</em>. Tatran: Bratislava, 1990.","https://nitrianskagaleria.sk/uljana-zmetakova-zrkadlenie-iii-a-iv/. Odkaz nájdený 29. 10. 2026."]}},"Veronika Rónaiová":{"en":{"head":"Veronika Rónaiová (1951)","bio":["She studied in the Department of Free Graphic Art and Book Illustration under Professor Orest Dubay (1970–1976). Her practice brings together painting, photography, collage and installation. She is a prominent representative of Slovak hyperrealism and photorealism. She has also taught at the Faculty of Education of Trnava University.","Her work frequently reflects on memory, painting, identity, family, relationships, self-quotation, quotation and the appropriation of art history and family heritage. She focuses on figurative painting, placing human figures within ordinary, everyday situations shaped by the atmosphere of a particular time and place. Her paintings thereby become investigations of interpersonal relationships, social interactions and her own position within the art world. In several projects she has engaged with the artistic legacy of her parents, Mária Filová and Julián Filo. Her work may be understood as a record of moments from everyday life, made vividly present through painting. Her artistic strategies can equally be seen as an ongoing, self-reflexive enquiry into artistic creativity, including her own. Her practice is both analytical and introspective.","The three paintings selected for the exhibition draw the viewer into the emotional texture of the moments depicted: the anonymity and distance between people at a bus stop; the seemingly ordinary loneliness and fatigue of daily life; or an individual’s psychological drama, never openly articulated…"],"refs":["RUSINOVÁ, Zora; KICZKOVÁ, Zuzana; GREGOR, Richard. Veronika Rónaiová. Bratislava: J. M. Press, 2004. ISBN 80-85417-11-1."]},"sk":{"head":"Veronika Rónaiová (1951)","bio":["Vyštudovala na Oddelení voľnej grafiky a knižnej ilustrácie pod vedením profesora Oresta Dubaya (1970 – 1976). Vo svojej tvorbe prepája maľbu, fotografiu, koláž, inštaláciu. Je výraznou predstaviteľkou slovenského hyperrealizmu a fotorealizmu. Pôsobila pedagogicky na Pedagogickej fakulte Trnavskej univerzity.","Vo svojej tvorbe často premýšľa o pamäti, maľovaní, identite, rodine, vzťahoch, autocitácii, citácii a apropriácii dejín umenia a rodinného dedičstva. Sústreďuje sa na figurálnu maľbu, ľudské postavy, ktoré sú umiestnené v žití každodenných situácií v realite a podliehajú atmosfére doby a miesta, čím vytvára maliarske sondy do medziľudských vzťahov, situácií v sociálnych interakciách a vlastného miesta v priestore umeleckého sveta. Vo viacerých projektoch pracovala s umeleckým odkazom svojich rodičov (Mária Filová, Julián Filo). Jej tvorbu môžeme vnímať ako záznamy momentov civilného života, ktoré vizuálne sprítomňuje. Taktiež môžeme chápať jej autorské stratégie ako neustále (seba)reflexívne vedenie polemiky nad (vlastnou) umeleckou kreativitou. Jej tvorba je analytická a introspektívna.","Vybraná trojica obrazov ukazuje ponorenie do pocitov zobrazených momentov. Na jednej strane pocit anonymity/odstupu ľudí na zastávke či „len“ emóciu všednej osamelosti a únavy, alebo nahlas nevypovedanú psychologickú drámu jednotlivca..."],"refs":["RUSINOVÁ, Zora – KICZKOVÁ, Zuzana – GREGOR, Richard. <em>Veronika Rónaiová</em>. Bratislava: J.M. Press, 2004. ISBN 80-85417-11-1."]}},"Veronika Šramatyová":{"en":{"head":"Veronika Šramatyová (1977)","bio":["Veronika Šramatyová graduated from the Academy of Fine Arts and Design in Bratislava in 2003, where she studied with Associate Professor Ilona Németh and Professor Daniel Fischer. In 2001 she undertook a study placement in Professor Jan Berdyszak’s sculpture and fine art studio at the University of the Arts in Poznań. She completed her doctorate in 2010 in Fischer’s Studio ± XXI. She received the Essl Award in 2007 and was a finalist in the VÚB Foundation’s Painting 2011 competition. Her post-conceptual practice brings photorealist and hyperrealist painting into dialogue; she has also taught and is active as a writer.","In Hobby Painting, Šramatyová explores the subject of the summer holiday, treading a fine line between taste and kitsch. She approaches the theme with irony, while maintaining a deliberate distance from her gouache snapshots. Sentimentality, an essential ingredient of kitsch, is central to the series. The pursuit of a perfect painting becomes a metaphor for the pursuit of perfect holiday photographs and memories. The holiday is at once an opportunity for relaxation and a privilege of consumer culture. These gouaches possess an almost literal photographic quality."],"refs":["https://old.nitrianskagaleria.sk/virtualna-galeria/veronika-sramatyova-z-archivov-benatske-bienale/. Accessed 29 October 2026."]},"sk":{"head":"Veronika Šramatyová (1977)","bio":["Vysokú školu výtvarných umení v Bratislave absolvovala v roku 2003 u doc. Ilony Németh a prof. Daniela Fischera. V roku 2001 absolvovala študijný pobyt v Ateliéri sochy a voľnej tvorby u prof. Jana Berdyszaka na Akadémii výtvarných umení v Poznani. Doktorandské štúdium ukončila v roku 2010 v Ateliéri ± XXI tiež u prof. Daniela Fischera. V roku 2007 sa stala laureátkou ceny Essl Award a v roku 2011 bola finalistkou súťaže Maľba 2011 organizovanou Nadáciou VÚB. Vo svojej tvorbe postkonceptuálne prepája fotorealistickú a hyperrealistickú maľbu, taktiež bola pedagogicky aktívna a je aj literárne činná.","V cykle <em>Hobby Painting</em> Šramatyová pracuje s témou letnej dovolenky. Lavíruje po tenkej hranici vkusu a gýču. S témou narába ironicky, ale zároveň cítiť autorkin odstup od gvašových momentiek. Pracuje so sentimentom, ktorý je dôležitou esenciou pri gýči. Pokus o dokonalú maľbu je aj metaforou/pokusom o dokonalé zábery/spomienky z dovolenky, ktorá je na jednej strane priestorom na relax, ale aj výsadou konzumného spôsobu života. Gvaše majú skutočne doslova fotografický rozmer."],"refs":["https://old.nitrianskagaleria.sk/virtualna-galeria/veronika-sramatyova-z-archivov-benatske-bienale/. Odkaz nájdený 29. 10. 2026."]}},"Viktor Frešo":{"en":{"head":"Viktor Frešo (1974)","bio":["Frešo studied at the Academy of Fine Arts and Design in Bratislava under Professors Jozef Jankovič and J. Hoffstädter, and at the Academy of Fine Arts in Prague under Associate Professor V. Skrepl and Professor M. Bielický. His practice draws on post-conceptual and post-minimalist tendencies. His search for a distinctive artistic language is also undoubtedly informed by his family background: he is the grandson of the celebrated Slovak actor and film director Paľo Bielik and the son of musician Fedor Frešo. Alongside his work as a sculptor and conceptual artist, Viktor Frešo is himself a musician.","Three of Frešo’s works in the exhibition resonate with its theme of nostalgia. In his sculpture of Jánošík, he revisits family history: Paľo Bielik played the legendary outlaw in Martin Frič’s iconic film. The work brings together the outlaw myth, family ties, the artist’s own ego and Pop Art aesthetics. Viewers may search the sculpture for a resemblance between Frešo and his grandfather. Metamorphosis Me continues his exploration of identity and self-perception, without relinquishing his characteristic self-irony. It connects his family archive with new technologies, including artificial intelligence, and with projects such as Past is More Than Future and Family Heritage. After Me interweaves and mixes musical sounds with the spoken voices of Frešo and his children."],"refs":["viktorfreso.com (accessed 2 November 2026).","https://nitrianskagaleria.sk/viktor-freso-niemand-tire/#o-autorovi (accessed 2 November 2026)."]},"sk":{"head":"Viktor Frešo (1974)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave (prof. J. Jankovič a prof. J. Hoffstädter) a na Akadémii umení v Prahe (doc. V. Skrepl a prof. M. Bielický). Jeho tvorba vychádza z postkonceptuálnych a postminimalistických tendencií a jeho cesta v hľadaní autorského jazyka vychádza určite aj zo skutočnosti, že je vnukom legendárneho slovenského herca a režiséra Paľa Bielika a synom hudobníka Fedora Freša. Samotný Viktor Frešo okrem toho, že je sochár – konceptuálny umelec, je aj hudobník.","Tri diela Viktora Freša na výstave korešpondujú s jej nostalgickou témou. V soche Jánošíka reaguje na rodinnú históriu – Paľo Bielik ako predstaviteľ Jánošíka v kultovom filme Martina Friča – a spája mýtus zbojníka s rodinnou väzbou, vlastným egom a pop-artovou estetikou. Návštevník môže v soche hľadať podobu Viktora Freša so svojím starým otcom. <em>Metamorphosis Me</em> nadväzuje na Frešovu tvorbu, kde skúma identitu, vnímanie vlastného ja a zároveň neopomína (seba) iróniu jemu vlastnú. Prepája a skúma vlastný rodinný archív s novými technológiami (aj s využitím AI) a inými projektami <em>(Past is More Than Future</em> či <em>Family Heritage</em>). <em>After Me</em> je o prepájaní a mixáži rôznych hudobných zvukov a hovoreného slova Freša a jeho detí."],"refs":["viktorfreso.com. Odkaz nájdený 2. 11. 2026.","https://nitrianskagaleria.sk/viktor-freso-niemand-tire/#o-autorovi. Odkaz nájdený 2. 11. 2026."]}},"Vladislav Zabel":{"en":{"head":"Vladislav Zabel (1975)","bio":["Vladislav Zabel studied art history at the Faculty of Arts, Comenius University in Bratislava, and painting in Professor Ján Berger’s studio at the Academy of Fine Arts and Design in Bratislava. He previously taught at the Academy of Arts in Banská Bystrica (2002–2005) and served as director of the Kysuce Gallery (2016–2024).","His work encompasses figurative compositions and historical, mythological and biblical subjects. He draws inspiration from the aesthetics and themes of Renaissance and Baroque art. At times, his painterly approach assumes an expressive, decadent quality.","A Midsummer Night’s Dream is inspired by William Shakespeare’s play of the same name, a magical comedy in which the human world becomes entangled with the realm of fairies and sprites. The action unfolds over a single night in an enchanted forest near Athens. In his painting, Zabel offers a perhaps gently satirical response to the play’s exploration of love.","In the tondo Caelum, he brings an open ‘divine space’ — the seven heavens — into the present, seeking to evoke, or dissolve, the boundary between earthly reality and infinity. The circular format recalls the Baroque era, when dramatic illumination and radiance suggested a divine source."],"refs":["https://vladislavzabel.com/. Accessed 22 October 2026."]},"sk":{"head":"Vladislav Zabel (1975)","bio":["Vyštudoval dejiny umenia na Filozofickej fakulte Univerzity Komenského v Bratislave a maľbu na Vysokej škole výtvarných umení v Bratislave v ateliéri prof. Jána Bergera. V minulosti pedagogicky pôsobil na Akadémii umení v Banskej bystrici (2002 – 2005) a ako riaditeľ Kysuckej galérie (2016 – 2024).","Vo svojej tvorbe sa venuje figurálnym kompozíciám, historickým, mytologickým a biblickým motívom. Inšpiruje sa estetikou a témami z renesančného a barokového umenia. Jeho maliarsky prístup môže miestami pôsobiť expresívno-dekadentne.","Obraz <em>Sen noci svätojánskej</em> je inšpirovaný rovnomenným dielom Williama Shakespeara. Ide o rozprávkovú, magickú hru, v ktorej sa mieša svet ľudí s čarovným svetom elfov a škriatkov. Celý príbeh sa odohráva počas jedinej noci v čarovnom lese neďaleko Atén. Zabel vo svojej maľbe poukázal možno aj trochu satiricky na ľúbostný rozmer tohto diela.","V tonde <em>Caelum</em> prináša do súčasnosti otvorený „božský priestor (sedem nebies)“, v ktorom sa pokúša evokovať/stierať hranicu medzi pozemskou realitou a nekonečnom. Cez tondo autor pripomína barokové časy, keď dramatické svetlo a žiara boli božským zdrojom."],"refs":["https://vladislavzabel.com/. Odkaz nájdený 22. 10. 2026."]}},"Štefan Papčo":{"en":{"head":"Štefan Papčo (1983)","bio":["The sculptor and visual artist Štefan Papčo studied in the Sculpture and Space studio at the Academy of Fine Arts and Design in Bratislava. His practice encompasses sculpture, objects, installation and new media. Combining traditional and innovative materials, he moves between figurative and abstract-symbolic forms.","Papčo takes classical figurative sculpture, executed with great technical precision in traditional materials, particularly wood, as his point of departure. He then develops it in more conceptual, minimalist and abstract directions. His works incorporate multimedia connections — video, the internet and digital technologies — as well as performative elements. He also employs less conventional materials, including concrete, silicone, fibreglass, wax and resin. Time, the passage and movement of natural forces, and process are central to his practice: he exposes certain works directly to the harsh weather of the mountains.","His art is inseparable from mountaineering, which he has pursued for many years. Frequently monumental in scale, his sculptures and installations can occupy an entire exhibition space, introducing into the comfort of the gallery something of the physical experience of the high mountains. Drawing on personal experience, he seeks to communicate the emotions and situations encountered by climbers: fear, euphoria, exertion, pain and danger, but also absolute freedom, the discovery of nature and the self, and the overcoming of physical and mental limits. Through extreme, potentially life-threatening situations, he addresses wider questions of humanism, spirituality and humanity’s relationship with nature.","Papčo has received several awards, including prizes for best open studio and the main award at the Dumbo Arts Festival in New York, and the 2013 Tatra banka Foundation Art Award in the Visual Arts – Young Artist category for his exhibition Lucy of the Rocks. His works are held in private and public collections across Europe. He is represented by Zahorian &amp; Van Espen Gallery.","Papčo has described a lifelong sense of nostalgia: ‘I feel as though I was born at the wrong time. That feeling has stayed with me. I would quite like to live in another era, another environment and a different social order.’","Alena and Stanislav are two sculptures from the larger Citizens series, dedicated to real people — citizens and mountaineers — who, during a period of political repression, created spaces of freedom in the high mountains. Mountaineering can also be understood as a personal stance: a refusal to surrender one’s inner life.","These two sculptures pay tribute to Alena Čepelková and Stanislav Glejdura, prominent Czechoslovak mountaineers of the 1970s and 1980s, both represented in Papčo’s Citizens series. The artist worked from archival photographs of the climbers.","Alena Čepelková became one of the leading Czech and Czechoslovak women mountaineers of the 1980s, climbing extensively in the High Tatras, the Alps, the Caucasus, the Pamirs and the Himalayas. In 1981, together with Zuzana Hofmannová, she completed the first women’s ascent of the Chergiani Pillar on Mount Tyutyu in the Caucasus. In 1982, the same pair made the first women’s — and first winter — ascent of the English Route on Piz Badile. Čepelková joined a Himalayan expedition to Dhaulagiri in 1984 and received the title of Master of Sport that year. From 2005 to 2009 she chaired the Czech Mountaineering Association. She is an important figure in the history of women’s mountaineering in Czechoslovakia.","Stanislav Glejdura was a Slovak and Czechoslovak mountaineer associated particularly with the Kalamárka climbing area near Zvolen. He arrived in Zvolen to study in 1978 and joined the Slávia VŠLD mountaineering club. Kalamárka became his principal climbing ground, where he established numerous routes and completed several first ascents. His climbing extended well beyond the local crags. In 1989, for example, he took part in an ascent of Pik Abalakov (6,446 metres) in the Pamirs, including a traverse towards Lenin Peak.","The Citizens series includes Pavel Pochylý, Miroslav Šmíd, Igor Koller, Stanislav Glejdura, Andrej Belica and Alena Čepelková. Papčo drew on photographs of these climbers taken in communist Czechoslovakia. The series forms part of his wider exploration of the relationship between nature and art, the physical presence of sculpture and the passage of time and movement, and the interaction of physical and mental experience."],"refs":["https://dennikn.sk/5422153/sochar-stefan-papco-narodil-som-sa-v-nespravnom-case/. Accessed 29 September 2026.","https://dennikn.sk/20501/dielo-dna-bivak/. Accessed 30 September 2026.","https://nitrianskagaleria.sk/stefan-papco-deviata-vlna/. Accessed 30 September 2026."]},"sk":{"head":"Štefan Papčo (1983)","bio":["Sochár a vizuálny umelec Štefan Papčo vyštudoval ateliér Socha a priestor na Vysokej škole výtvarných umení v Bratislave. Vo svojej tvorbe sa venuje sochárstvu, objektu, inštalácii a novým médiám. Kombinuje tradičné aj inovatívne materiály a pohybuje sa medzi figuratívnymi a abstraktno-symbolickými formami.","Autor vychádza z klasického, figuratívneho sochárstva s precíznym remeselným prevedením v tradičných materiáloch (najmä drevo), ktoré posúva do konceptuálnejších rovín a minimalistického, abstraktného prejavu. Diela obohacuje o multimediálne prepojenia (video, internet, digitálne technológie) a performatívne prvky, pracuje aj s menej tradičnými materiálmi ako betón, silikón, laminát, vosk, živice a pod. Zaujíma ho motív času, plynutie a pohyb prírodných síl, procesuálnosť – na niektoré diela necháva priamo pôsobiť drsné horské počasie. Jeho tvorba je bytostne spätá s horolezectvom, ktorému sa dlhodobo venuje. Často pracuje s monumentálnou mierkou – jeho sochy a inštalácie vedia vyplniť celý výstavný priestor, čím do mondénneho pohodlia galerijného interiéru prinášajú (nielen) fyzický zážitok z vysokohorskej krajiny. Na základe osobných skúseností sa snaží divákom sprostredkovať pocity a situácie, ktoré zažívajú horolezci: strach, eufóriu, drinu, bolesť, pocity ohrozenia, ale aj absolútnej slobody, spoznávanie prírody i samého seba, prekonávanie fyzických a mentálnych limitov. Cez skúmanie modelových hraničných (až život ohrozujúcich) situácií však poukazuje aj na univerzálnejšie témy humanizmu, spirituality, vzťahu človeka k prírode.","Je držiteľom viacerých ocenení vrátane ceny za najlepší otvorený ateliér a hlavnej ceny Dumbo Arts Festival v New Yorku a Ceny Nadácie Tatra banky za umenie 2013 v kategórii Výtvarné umenie – Mladý tvorca za výstavu <em>Lucy of the Rocks</em>. Jeho diela sú vo viacerých súkromných a verejných zbierkach európskych inštitúcií. Zastupuje ho galéria Zahorian &amp; Van Espen.","Štefan Papčo o sebe tvrdí, že odjakživa pociťuje istý druh nostalgie: „Mám pocit, akoby som sa narodil v nesprávnom čase. A to mi ostalo doteraz. Celkom rád by som žil v inej dobe, v inom prostredí a aj v inom spoločenskom nastavení.“","<em>Občania Alena a Stanislav</em> sú dve sochy z väčšej série <em>Občania</em>, ktorú Papčo venoval skutočným ľuďom/občanom/horolezcom, teda smrteľníkom, ktorí v čase neslobody vytvárali slobodné prostredie v našich veľhorách. Horolezectvo môžeme vnímať aj ako osobný postoj človeka, ktorý si nenechá vziať svoj vnútorný život.","Tieto dve sochy sú poctou Alene Čepelkovej a Stanislavovi Glejdurovi, ktorí patrili k popredným československým horolezcom 70. a 80. rokov 20. storočia, a obaja sú zachytení v sochárskom cykle Štefana Papča s názvom <em>Občania</em>. Autor vychádza z ich archívnych fotografií.","Alena Čepelková sa stala jednou z popredných českých, resp. československých horolezkýň 80. rokov. Intenzívne sa venovala horolezectvu vo Vysokých Tatrách, Alpách, na Kaukaze, v Pamíre a v Himalájach.","V roku 1981 uskutočnila spolu so Zuzanou Hofmannovou prvý ženský výstup Čergianiho pilierom na štít Ťuťu na Kaukaze. V roku 1982 tá istá dvojica absolvovala prvý ženský – a zároveň prvý zimný – výstup Anglickou cestou na Piz Badile. Bola členkou himalájskej expedície na Dhaulágirí v roku 1984 a v tom istom roku získala titul majsterka športu. Neskôr, v rokoch 2005 – 2009, pôsobila ako predsedníčka Českého horolezeckého zväzu (ČHS). Je významnou postavou v dejinách československého ženského horolezectva.","Stanislav Glejdura bol slovenský, resp. československý horolezec, ktorého meno sa spája najmä s oblasťou Kalamárka pri Zvolene. Do Zvolena prišiel študovať v roku 1978 a stal sa členom horolezeckého oddielu Slávia VŠLD. Kalamárka sa následne stala jeho hlavnou lezeckou oblasťou, kde vytvoril množstvo ciest a uskutočnil viacero prvovýstupov. Jeho lezecké aktivity však presahovali rámec miestnych skalných oblastí. Napríklad v roku 1989 sa podieľal na výstupe na Pik Abalakova (6 446 m. n. m.) v Pamíre, ktorého súčasťou bol aj traverz smerom k Piku Leningrad.","<em>Séria Občania</em> zahŕňa osobnosti ako Pavel Pochylý, Miroslav Šmíd, Igor Koller, Stanislav Glejdura, Andrej Belica a Alena Čepelková. Umelec pri tvorbe využil fotografie týchto horolezcov z čias komunistického Československa. Séria je súčasťou Papčovho záujmu o prepojenie prírody a umenia, fyzickej prítomnosti sochy s časom a pohybom, vzťahu fyzického a mentálneho."],"refs":["https://dennikn.sk/20501/dielo-dna-bivak/. Odkaz nájdený 30. 9. 2026.","https://dennikn.sk/5422153/sochar-stefan-papco-narodil-som-sa-v-nespravnom-case/. Odkaz nájdený 29. 9. 2026.","https://nitrianskagaleria.sk/stefan-papco-deviata-vlna/. Odkaz nájdený 30. 9. 2026."]}}};

/* ===== Jazyk SK / EN ===== */
let lang='sk';try{const sv=localStorage.getItem('lang');if(sv==='en'||sv==='sk')lang=sv}catch(e){}
const L=()=>lang==='en'?1:0;
const STR={
  sk:{ph:'Autor – vyberte alebo napíšte meno',author:'Autor',clr:'Zrušiť filter',drop:'Zobraziť zoznam autorov',close:'Zavrieť',more:'Ďalšie diela autora',refs:'Pozri bližšie',none:'Autor so zadaným menom nie je vo výstave.',noOthers:'Autor nemá vo výstave ďalšie diela.',title:'Čas na realizmus?',ai:'Anglické texty boli preložené pomocou AI.'},
  en:{ph:'Artist – choose or type a name',author:'Artist',clr:'Clear filter',drop:'Show list of artists',close:'Close',more:'More works by this artist',refs:'Further reading',none:'No artist with this name in the exhibition.',noOthers:'No other works by this artist in the exhibition.',title:'Time for Realism?',ai:'English texts were translated using AI.'}
};
const S=()=>STR[lang];
function applyStatic(){
  const t=S();document.documentElement.lang=lang;document.title=t.title;
  q.placeholder=t.ph;q.setAttribute('aria-label',t.author);clr.setAttribute('aria-label',t.clr);drop.setAttribute('aria-label',t.drop);
  document.getElementById('dc').setAttribute('aria-label',t.close);document.getElementById('oh').textContent=t.more;document.getElementById('note').textContent=t.ai;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
}
function setStatus(){
  const n=list.length;
  status.textContent=lang==='en'
    ?(filter?`${filter} · ${n} ${n===1?'work':'works'}`:`${n} works · drag to browse, tap a work`)
    :(filter?`${filter} · ${n} ${n===1?'dielo':n<5?'diela':'diel'}`:`${n} diel · potiahnite prstom a vyberte dielo`);
}
function setLang(l){
  lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  applyStatic();
  els.forEach((b,k)=>b.setAttribute('aria-label',list[k].t[L()]+', '+list[k].author));
  setStatus();closeSug();
  if(dlg.open&&cur)openWork(byId[cur]);
}

/* ===== Rozloženie ako na Apple Watch (včelia plástva) + zväčšovanie pri strede ===== */
const GAP=118; let list=[], els=[], pos=[], ox=0, oy=0, vx=0, vy=0, raf=0, filter=null;
let bounds={x:0,y:0};
function build(){
  stage.innerHTML='';
  list=works.filter(w=>!filter||w.author===filter);
  const n=list.length;
  /* náhodné, ale stabilné rozmiestnenie: každé dielo má minimálny odstup od ostatných */
  let sd=filter?[...filter].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,17):2024;
  const rng=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  const area=n*GAP*GAP*1.6, hw=Math.sqrt(area*1.25)/2, hh=Math.sqrt(area/1.25)/2;
  let md=GAP*1.05; pos=[];
  list.forEach(()=>{let p,t=0;
    do{p={x:(rng()*2-1)*hw,y:(rng()*2-1)*hh};t++;if(t%50===0)md*=.92;}
    while(t<600&&pos.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<md));
    pos.push(p);});
  bounds={x:hw,y:hh};
  els=list.map(w=>{const b=document.createElement('button');b.className='w';b.type='button';
    const S=116,bw=w.ar>=1?S:S*w.ar,bh=w.ar>=1?S/w.ar:S;
    b.style.width=bw+'px';b.style.height=bh+'px';b.style.margin=`${-bh/2}px 0 0 ${-bw/2}px`;
    if(w.round)b.style.borderRadius='50%';b.setAttribute('aria-label',w.t[L()]+', '+w.author);
    b.addEventListener('click',()=>{if(!moved)openWork(w)});stage.appendChild(b);return b;});
  ox=oy=0;vx=vy=0;render();
  setStatus();
}
function render(){
  const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2+20,R=Math.min(W,H)*.55;
  for(let k=0;k<els.length;k++){
    const x=pos[k].x+ox,y=pos[k].y+oy,d=Math.hypot(x,y),t=Math.min(1,d/R);
    const sc=.26+1.12*Math.pow(1-t,1.35)+(t>=1?0:0);
    els[k].style.transform=`translate(${cx+x}px,${cy+y}px) scale(${sc.toFixed(3)})`;
    els[k].style.opacity=Math.min(1,.35+sc*1.1).toFixed(2);
    els[k].style.zIndex=Math.round(sc*100);
  }
}
function clamp(){
  const lx=bounds.x+40, ly=bounds.y+40;
  ox=Math.max(-lx,Math.min(lx,ox)); oy=Math.max(-ly,Math.min(ly,oy));
}
function glide(){
  ox+=vx;oy+=vy;vx*=.93;vy*=.93;clamp();render();
  if(Math.hypot(vx,vy)>.2)raf=requestAnimationFrame(glide);
}
let down=false,moved=false,sx=0,sy=0,lx=0,ly=0,lt=0;
stage.addEventListener('pointerdown',e=>{down=true;moved=false;sx=lx=e.clientX;sy=ly=e.clientY;lt=performance.now();cancelAnimationFrame(raf);vx=vy=0;});
addEventListener('pointermove',e=>{
  if(!down)return;
  if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){moved=true;stage.classList.add('drag');}
  if(!moved)return;
  const now=performance.now(),dt=Math.max(1,now-lt);
  const dx=e.clientX-lx,dy=e.clientY-ly;ox+=dx;oy+=dy;clamp();
  vx=dx/dt*16;vy=dy/dt*16;lx=e.clientX;ly=e.clientY;lt=now;render();
});
function end(){if(!down)return;down=false;stage.classList.remove('drag');if(moved){raf=requestAnimationFrame(glide);setTimeout(()=>moved=false,0);}}
addEventListener('pointerup',end);addEventListener('pointercancel',end);
stage.addEventListener('wheel',e=>{e.preventDefault();ox-=e.deltaX;oy-=e.deltaY;clamp();render();},{passive:false});
addEventListener('resize',render);

/* ===== Výber autora so návrhmi ===== */
let active=-1,shown=[];
function suggest(all){
  const v=norm(q.value.trim());
  shown=authors.filter(a=>all||!v||norm(a).includes(v));
  sug.innerHTML=shown.length?'':'<p>'+S().none+'</p>';
  shown.forEach((a,k)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');
    b.innerHTML=`<span>${a}</span><small>${works.filter(w=>w.author===a).length}</small>`;
    b.addEventListener('mousedown',e=>{e.preventDefault();pick(a)});sug.appendChild(b);});
  active=-1;sug.classList.add('open');q.setAttribute('aria-expanded','true');
}
function closeSug(){sug.classList.remove('open');q.setAttribute('aria-expanded','false');}
function pick(a){filter=a;q.value=a;clr.hidden=false;closeSug();q.blur();build();}
function reset(){filter=null;q.value='';clr.hidden=true;closeSug();build();}
q.addEventListener('focus',()=>suggest(!q.value));
q.addEventListener('input',()=>{suggest(false);if(!q.value&&filter)reset();});
q.addEventListener('blur',()=>setTimeout(closeSug,120));
q.addEventListener('keydown',e=>{
  const bs=[...sug.querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!sug.classList.contains('open'))suggest(true);
    active=(active+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,k)=>b.classList.toggle('on',k===active));}
  else if(e.key==='Enter'){e.preventDefault();if(active>=0)pick(shown[active]);else if(shown.length===1)pick(shown[0]);}
  else if(e.key==='Escape')closeSug();
});
drop.addEventListener('mousedown',e=>e.preventDefault());
drop.addEventListener('click',()=>sug.classList.contains('open')?closeSug():suggest(true));
clr.addEventListener('click',reset);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))closeSug();});

/* ===== Popup ===== */
function openWork(w){
  cur=w.id;
  if(location.hash.slice(1)!==w.id)try{location.hash=w.id}catch(e){}
  const da=document.getElementById('da');da.style.borderRadius=w.round?'50%':'0';da.style.aspectRatio=w.ar;da.style.width=`min(100%,${(46*w.ar).toFixed(1)}vh)`;
  document.getElementById('dt').textContent=w.t[L()];
  document.getElementById('dm').textContent=`${w.author}, ${w.year}`;
  document.getElementById('dn').textContent=[w.tech[L()],w.dim,w.coll[L()]].filter(Boolean).join('\n');
  const mm=MED[w.author],ml=mm&&mm[lang],ms=document.getElementById('dmed');
  ms.hidden=!ml;
  if(ml){document.getElementById('dmh').textContent=ml.head;
    document.getElementById('dmb').innerHTML=ml.bio.map(x=>'<p>'+x+'</p>').join('');
    document.getElementById('dmr').innerHTML=ml.refs.length?'<h4>'+S().refs+'</h4>'+ml.refs.map(x=>'<p>'+x+'</p>').join(''):'';
    if(lang==='en')document.getElementById('dmr').insertAdjacentHTML('beforeend','<p class="ainote">'+S().ai+'</p>');}
  const ul=document.getElementById('do');ul.innerHTML='';
  const others=works.filter(o=>o.author===w.author&&o!==w);
  if(!others.length)ul.innerHTML='<li style="color:var(--muted);font-size:14px">'+S().noOthers+'</li>';
  others.forEach(o=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=o.t[L()];
    b.addEventListener('click',()=>openWork(o));li.appendChild(b);ul.appendChild(li);});
  if(!dlg.open)dlg.showModal();document.querySelector('.body').scrollTop=0;
}
document.getElementById('dc').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});

/* ===== Odkaz na každé dielo: #01 … (na vlastnej doméne aj /01) ===== */
let cur=null;
const byId=Object.fromEntries(works.map(w=>[w.id,w]));
function route(){
  const raw=location.hash.slice(1)||(location.pathname.match(/\/(\d{1,3})\/?$/)||[])[1]||'';
  const w=byId[raw.padStart(2,'0')];
  if(w){if(cur!==w.id)openWork(w);}
  else if(dlg.open)dlg.close();
}
addEventListener('hashchange',route);
dlg.addEventListener('close',()=>{cur=null;try{if(location.hash)history.replaceState(null,'',location.pathname+location.search);}catch(e){}});

document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
applyStatic();build();route();
</script>
