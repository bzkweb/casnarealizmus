<title>Čas na realizmus?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --wall:#e3e7e4; --ink:#1c2a31; --muted:#566a74; --panel:#f6f7f5; --line:#c3cdc9; --accent:#a8641a;
  --ui:"Bricolage Grotesque",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--wall);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;padding:14px 100px;display:flex;gap:10px;align-items:center;justify-content:center;pointer-events:none}
.lang{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;pointer-events:auto}
.lang button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:none;border:0;border-radius:999px;min-width:40px;height:34px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:560px){header{padding:58px 16px 14px}.lang{top:14px;transform:none}}
.search{position:relative;width:min(420px,100%);pointer-events:auto}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:12px 88px 12px 18px;outline:none}
.search input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.search .btns{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.search .btns button{border:0;background:none;color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.search .btns button:hover,.search .btns button:focus-visible{color:var(--ink);background:var(--line);outline:none}
#sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:18px;max-height:46vh;overflow:auto;padding:6px;display:none}
#sug.open{display:block}
#sug button{display:flex;justify-content:space-between;width:100%;font:inherit;color:var(--ink);background:none;border:0;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
#sug button:hover,#sug button.on{background:var(--line)}
#sug small{color:var(--muted)}
#sug p{margin:0;padding:10px 12px;color:var(--muted)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
.w{position:absolute;left:0;top:0;padding:0;cursor:pointer;will-change:transform;touch-action:none}
.w:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#note{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
#status{position:fixed;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:14px;pointer-events:none}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:24px;padding:0;width:min(560px,calc(100vw - 24px));max-height:90vh;max-height:90dvh;overflow:hidden}
dialog::backdrop{background:rgba(8,14,18,.62)}
dialog[open]{display:flex;flex-direction:column;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.stagewrap{flex:none;display:flex;justify-content:center;padding:18px;background:rgba(0,0,0,.2)}
.w,.art{--x:#6f6f6f;background-color:#fff;border:1px solid var(--x);border-radius:0;box-shadow:none;background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--x) calc(50% - .5px),var(--x) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--x) calc(50% - .5px),var(--x) calc(50% + .5px),transparent calc(50% + .5px))}
.body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 24px 24px}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 4px}
.meta{margin:0 0 14px;color:var(--muted);font-size:15px}
.ann{white-space:pre-line;font-family:var(--serif);font-size:18px;line-height:1.55;margin:0 0 20px;max-width:60ch}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.others{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.others button{font:inherit;font-size:14px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.others button:hover,.others button:focus-visible{border-color:var(--accent);outline:none}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
.close:focus-visible{outline:3px solid var(--accent)}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.med{margin:0 0 22px;padding-top:18px;border-top:1px solid var(--line)}
.med[hidden]{display:none}
.med h3{font-size:17px;margin:0 0 10px}
.med p{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0 0 .85em;max-width:62ch}
.refs h4{font-size:14px;font-weight:600;margin:16px 0 6px}
.med .refs p{font-family:var(--ui);font-size:14px;line-height:1.45;color:var(--muted);margin:0 0 6px;overflow-wrap:anywhere}
.med .refs p.ainote{font-style:italic;font-size:12px;margin-top:14px}
</style>

const MED = {"Adam Šakový":{"en":{"head":"Adam Šakový (1987)","bio":["Adam Šakový studied at the Academy of Fine Arts and Design in Bratislava (2007–2013), in the painting studio led by Associate Professor Klaudia Kosziba. He has been a finalist for the VÚB Foundation’s painting award for young artists on several occasions.","A respected figure in contemporary Slovak painting, Šakový combines figurative painting with post-conceptual thinking. He is particularly known for his use of the airbrush. His work addresses transience, art history and digital manipulation. Alongside painting, his practice encompasses photography, installation and objects.","The two paintings from the wider Stones series belong to one of Šakový’s distinctive bodies of work. In them, he explores the limits of painting and the possibilities of visually manipulating reality. Drawing on historical motifs, he translates sculptural representation into the pictorial space. Rather than the historical identity of the subjects or the stories behind them, what interests him is the interplay of light and shadow and the modelling of form through the airbrush. He seeks, quite literally, to paint and analyse the materiality of stone. His command of the spray gun blurs the boundaries between sculpture, photography and painting, while generating a productive tension for the viewer: the depicted stone is not stone at all, but paint."],"refs":["www.adamsakovy.sk. Accessed 29 October 2026.","https://nitrianskagaleria.sk/adam-sakovy-1914-still-alive-4/. Accessed 29 October 2026."]},"sk":{"head":"Adam Šakový (1987)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave (2007 – 2013) v Ateliéri mal+by pod vedením doc. Klaudie Kosziby. Viackrát bol finalistom Ceny Nadácie VÚB za maliarske dielo pre mladých umelcov.","Patrí k rešpektovaným predstaviteľom súčasnej slovenskej maľby, vo svojej tvorbe prepája figuratívne maliarske médium s postkonceptuálnym myslením. Známy je používaním techniky airbrushu. Vo svojich dielach pracuje s témami pominuteľnosti, dejín umenia a digitálnej manipulácie. Okrem maľby sa venuje fotografii, inštalácii a objektom.","Dve maľby z širšieho cyklu <em>Kamene</em> patria k výrazným sériám Adama Šakového. Autor v ňom skúma hranice maľby, možnosti vizuálnej manipulácie reality. Cez využitie historických motívov prepisuje sochárske zobrazenie do priestoru obrazu. Pre Šakového nie je dôležitá historická podstata či príbeh, ktorý je zvyčajne za zobrazením, užíva si prácu/hru svetla a tieňa a ich modelovanie cez airbrush. Doslova sa snaží maľovať/analyzovať materiál kameňa. Striekacia pištoľ a jej veľmi dobré ovládanie v rukách Adama Šakového tak stiera hranice medzi sochou, fotografiou a maľbou, no zároveň vytvára živé napätie u diváka vo vnímaní zobrazeného materiálu kameňa, ktorý nie je kameňom, ale maľbou."],"refs":["www.adamsakovy.sk. Odkaz nájdený 29. 10. 2026.","https://nitrianskagaleria.sk/adam-sakovy-1914-still-alive-4/. Odkaz nájdený 29. 10. 2026."]}},"Bohdan Hostiňák":{"en":{"head":"Bohdan Hostiňák (1968)","bio":["Bohdan Hostiňák was born on 18 September 1968 in Svidník. From 1983 to 1989, he studied in the restoration department of the Secondary School of Applied Arts in Košice. Between 1991 and 1997, he studied at the Academy of Fine Arts and Design in Bratislava, in Rudolf Sikora’s Open Studio.","His work has featured in major exhibitions in Slovakia, including 20th Century: A History of Slovak Fine Art (Slovak National Gallery, Bratislava, 2000), and internationally, including Check Slovakia! Junge Kunst aus der Slowakei (Berlin, 2004), The New Ten (Künstlerhaus Wien, 2004) and PitoreSKa (Wannieck Gallery, Brno, 2007). He held solo exhibitions at the Ján Koniarek Gallery, curated by Vladimír Beskid, in 2006 and 2010. His exhibitions abroad have included Krajina (Landscape) at Galerie Václava Špály, Prague (2001), and Kult paradoksu (The Cult of Paradox) at the Ujazdowski Castle gallery in Warsaw, Poland (2002), alongside Marek Blažo and Miloš Kopták."],"refs":[]},"sk":{"head":"Bohdan Hostiňák (1968)","bio":["Bohdan Hostiňák sa narodil 18. septembra 1968 vo Svidníku. V rokoch 1983 – 1989 študoval na Strednej umeleckopriemyselnej škole v Košiciach, oddelenie reštaurovania. V rokoch 1991 – 1997 študoval na Vysokej škole výtvarných umení v Bratislave v Otvorenom ateliéri Rudolfa Sikoru. Jeho tvorba bola zahrnutá do ťažiskových domácich (20. storočie – Dejiny slovenského výtvarného umenia, SNG, Bratislava, 2000) a zahraničných výstavných projektov (Check Slovakia!, Junge Kunst aus der Slowakei, Berlín, 2004; The New Ten, Künstlerhaus Wien, 2004, PitoreSKa – Wannieck Gallery, Brno, 2007). Samostatne vystavoval v Galérii Jána Koniarka v koncepcii Vladimíra Beskida (2006 a 2010).V zahraničí to bola napríklad výstava Krajina (Galerie Václava Špály, Praha, 2001) a Kult paradoksu v prestížnej galérii Zamek Ujazdowski vo Varšave v Poľsku (2002, spolu s Markom Blažom a Milošom Koptákom)."],"refs":[]}},"Dorota Sadovská":{"en":{"head":"Dorota Sadovská (1973)","bio":["Dorota Sadovská studied at the Academy of Fine Arts and Design in Bratislava under Professor Rudolf Sikora (1991–1997), and at the École Nationale des Beaux-Arts in Dijon (1997–1999). She completed her doctoral studies in 2004.","In her practice, Sadovská brings together elements of realist painting, photography, video and spatial installation. The body and its identity constitute a central concern. Frequently depicted from unconventional viewpoints, the body is presented in its fragility, vulnerability and transience.","Sacred subjects and representations are another important strand of her work.","The Stay Home series developed gradually during the COVID-19 pandemic, beginning in 2020. Responding to the period of lockdowns, it can also be read as a meditation on human proximity, discomfort and the unfamiliar circumstances brought about by isolation as a means of preventing the spread of the virus. Home emerges as the principal setting of human life: a place of safety, but also a space in which interpersonal relationships unfold.","In Self-Portrait with Husband II, Sadovská revisits a broader body of work concerned with married couples and their relationships. Once again, she addresses intimacy, coexistence and human difference, challenging established conventions of portraiture."],"refs":["www.sadovska.sk. Accessed 28 October 2026."]},"sk":{"head":"Dorota Sadovská (1973)","bio":["Študovala na Vysokej škole výtvarných umení v Bratislave pod vedením prof. Rudolfa Sikoru (1991 – 1997), École Nationale des Beaux-Arts v Dijone (1997 – 1999). Doktorandské štúdium ukončila v roku 2004.","Dorota Sadovská vo svojej tvorbe spája prvky realistickej maľby, fotografie, videa a priestorových inštalácií. Dôležitou témou v jej tvorbe je telo a jeho identita, často zobrazené v neštandardných uhloch pohľadu, čím zdôrazňuje jeho krehkosť, zraniteľnosť a pominuteľnosť.","Jej dôležitou témou je aj práca so sakrálnymi námetmi a zobrazeniami.","Cyklus <em>Stay Home</em> (Zostaň doma) vznikal postupne v období pandémie COVID-19 od roku 2020. Autorka v ňom reaguje na obdobie lockdownov a možno ho interpretovať aj ako zamyslenie sa nad ľudskou blízkosťou s diskomfortom a nezvyčajnými situáciami, ktoré priniesla izolácia ako prevencia proti šíreniu vírusu. Domov ako hlavný priestor ľudského života, domov ako bezpečie, domov ako priestor medziľudských vzťahov.","V <em>Autoportréte s manželom II.</em> autorka nadväzuje na širší okruh svojej tvorby, v ktorom sa zaoberala manželskými dvojicami a ich vzájomným vzťahom. V tejto téme opäť reaguje na ľudskú blízkosť, spolužitie i rozdielnosť ľudí. Znova tu pracuje s nie všeobecne kanonizovanými predstavami o portréte."],"refs":["www.sadovska.sk. Odkaz nájdený 28. 10. 2026."]}},"Dušan Mravec":{"en":{"head":"Dušan Mravec (1980)","bio":["Mravec studied at the Academy of Arts in Banská Bystrica in Professor Stanislav Balko’s studio (1999–2002), before continuing at the Academy of Fine Arts in Prague (2002–2008) under Professors Miloš Šejn, Zdeněk Beran and Milan Knížák. He undertook a study placement at the Royal Academy of Fine Arts in Antwerp (2026).","Dušan Mravec’s work combines realist representation with personal experience. Through painting, he seeks his own means of interpreting reality, transforming what he depicts according to his perception at a particular moment. He frequently experiments with layers of paint and glazes, combining techniques while retaining an acute sensitivity to detail. This encourages viewers to look beneath the surface of the painting, towards a more inward sense of self.","In Babylon and Persepolis, he engages with the powerful histories of these ancient cities. Babylon draws on the biblical account of the Tower of Babel and the division of languages. To construct the painting, he used handmade stencils inspired by photographic and cinematographic film. The resulting filmstrip-like visual structure reminds us that we remain part of something larger and more diverse – something that binds us together. Different as films may be, they are ours: made by us, for us and about us. They form a shared cultural and human fabric. Although Babel signifies division, Mravec seeks to overcome barriers through a universal visual language, fostering understanding and reconnecting separated worlds.","Persepolis reflects the artist’s fascination with old objects, transience and the dramatic fates of vanished civilisations. It also draws on his longstanding practice of making paintings with coffee. He subjected the oil painting to corrosive processes and experimented with sediment, memory and forms of patina as traces of time, history and a place’s collective memory. The result is a visual reminder of history’s cyclical nature. The acropolis of Persepolis, like so many places before it, fell into ruin; its remains now speak only faintly of former grandeur. Through this volatile painting, Mravec evokes dramatic reversals, peaks and declines that may equally await our modern cities and places.","Sisters and Memories address family memory. In the intimate painting Sisters, he depicts his mother and her sister at a country cottage. The two young women pose in a fleeting snapshot against a setting of personal significance to the artist.","Memories offers an intimate glimpse into a space saturated with personal history. Painted at the same cottage as Sisters, it depicts a table bearing casually arranged photographs of people who now live only in the artist’s memory, alongside other objects. He paints them with reverent fidelity, exactly as they lay at that moment. Although the people are gone, they remain together on the table, as though we wished to keep their memory constantly present. The composition becomes a visual altar to family memory, in which ordinary objects and relics acquire the status of precious witnesses to time, our roots and the unstoppable passage of life."],"refs":["www.dusanmravec.com (accessed 22 October 2026)."]},"sk":{"head":"Dušan Mravec (1980)","bio":["Študoval na Akadémii umení v Banskej Bystrici v ateliéri prof. Stanislava Balka (1999 – 2002), ďalej pokračoval na Akadémii výtvarných umení v Prahe (2002 – 2008) pod vedením prof. Miloša Šejna, prof. Zdeňka Berana a prof. Milana Knížáka. Absolvoval študijný pobyt na Kráľovskej akadémii výtvarných umení v Antverpách (2026).","Tvorba Dušana Mravca spája realistické zobrazovanie skutočnosti s osobným prežívaním autora. V maľbe si hľadá svoju cestu na interpretáciu reality. Zobrazenú skutočnosť pretvára na základe svojho aktuálneho vnímania, často experimentuje s vrstvením farieb, lazúrami. Kombinuje techniky, ale zachováva si cit pre detail, čím umocňuje v divákovi pocit, že ide „pod povrch“ maľby, bližšie k vnútornej podstate ja.","V maľbách <em>Babylon</em> a <em>Persepolis</em> pracuje so silným príbehom týchto historických miest. Plátno <em>Babylon</em> namaľoval na motívy známeho biblického mýtu o Babylonskej veži a rozdelení jazykov. Ako stavebný materiál použil šablóny vlastnej výroby, inšpirované filmovými a fotografickými kinofilmami. Vizuálna štruktúra podobná filmovému pásu pripomína, že sme stále súčasťou niečoho väčšieho, rôznorodejšieho – niečoho, čo nás spája v jedno. Všetky filmy, hoci sú rozdielne, sú naše: pochádzajú od nás, pre nás a sú o nás. Fungujú ako spoločné kultúrne a ľudské tkanivo. Hoci v Babylone došlo k rozdeleniu, Mravec sa snaží prostredníctvom svojho vlastného univerzálneho vizuálneho jazyka bariéry prekonávať, hľadať porozumenie a rozdelené svety opäť spájať.","<em>Persepolis</em> odzrkadľuje autorovu záľubu v starých veciach, pominuteľnosti a dramatických osudoch zaniknutých civilizácií. V tomto diele sa prirodzene prelína Mravcova dlhoročná tvorba kávových obrazov. Rozleptal olejový obraz a experimentoval s témou sedimentu, pamäti a s rôznymi formami patiny ako znakmi času, histórie a kolektívnej pamäti miesta či danej doby. Je to vizuálne memento cyklickosti dejín. Akropola Persepolisu, ako aj mnohé iné miesta v minulosti, zažila svoj pád a jej ruiny nám dnes už len matne rozprávajú o niekdajšej veľkosti. Prostredníctvom tejto výbušnej maľby poukazuje na dramatické zvraty, vrcholy a pády, ktorým sa nevyhnú ani naše dnešné moderné mestá a miesta.","Spomienkové maľby <em>Sestry</em> a <em>Spomienky</em> sú o témach rodinnej pamäti. V komorne ladenom obraze <em>Sestry</em> zachytáva svoju mamu a jej sestru na chalupe. Dve mladé ženy pózujú v prchavej momentke na pozadí a mieste, ktoré má pre autora určitý význam.","Obraz <em>Spomienky</em> je intímnou sondou do priestoru nasiaknutého osobnou históriou. Vznikol v tej istej chalupe ako <em>Sestry</em>. Zachytil stôl a nearanžované fotografie ľudí, ktorí žijú už len v autorových spomienkach, spolu s ďalšími predmetmi. Namaľoval ich s pietnou vernosťou presne tak, ako tam v danom momente ležali. Hoci títo ľudia už odišli, na tomto stole sú stále pokope, akoby sme si ich chceli neustále pripomínať. Kompozícia tak funguje ako vizuálny oltár rodinnej pamäti, v ktorom všedné objekty a relikvie nadobúdajú rozmer vzácnych svedectiev o čase, našich koreňoch a nezastaviteľnom prúde života."],"refs":["www.dusanmravec.com. Odkaz nájdený 22. 10. 2026."]}},"Dušana Vrbovská":{"en":{"head":"Dušana Vrbovská (1992)","bio":["Dušana Vrbovská studied at the Faculty of Fine Arts of the Academy of Arts in Banská Bystrica. She completed her bachelor’s degree (2013–2017) in Professor Ľudovít Hološka’s Classical Painting Disciplines studio and her master’s degree (2018–2019) in Associate Professor Rastislav Podoba’s Open Painting Studio. In 2016 she undertook a study placement in Associate Professor Aleš Ogoun’s painting studio at the Faculty of Design and Art, University of West Bohemia in Plzeň. She has twice been a finalist in the VÚB Foundation’s Painting Award for young artists (2018 and 2023).","Vrbovská’s paintings capture different aspects of nature, its transformations and structures. Her meticulous technique and distinctive poetic sensibility draw the eye — and subsequently the mind — towards existential reflection. In a lyrical visual language, she evokes the enduring tension between being and non-being, and the cycle of life. Tiny flowers and plants, crushed within concrete paving yet striving to exist and blossom, become her subjects. Through these apparently modest still lifes of pavements and front gardens, she invites us to consider the magnitude and resilience of nature.","Her interest in historical painting techniques places her among contemporary artists seeking their own interpretations of reality in a fluid age. She sets the beauty of continually renewing vegetation against slowly deteriorating concrete, which seems to retain the memory of a bygone political era. The resulting visual language is at once nostalgic and dystopian. Her search for beauty where it might scarcely be expected can also be understood as a search for hope."],"refs":["https://www.instagram.com/dusana.vrbovska/. Accessed 14 October 2026.","https://www.artbase.sk/product-tags/dusana-vrbovska/. Accessed 14 October 2026."]},"sk":{"head":"Dušana Vrbovská (1992)","bio":["Dušana Vrbovská študovala na Fakulte výtvarných umení Akadémie umení v Banskej Bystrici. Bakalárske štúdium (2013 – 2017) absolvovala v Ateliéri klasických maliarskych disciplín u prof. Ľudovíta Hološku, akad. maliara; magisterské štúdium (2018 – 2019) v Otvorenom ateliéri maľby u doc. Mgr. art. Rastislava Podobu, ArtD. V roku 2016 absolvovala študijný pobyt na Západočeskej univerzite v Plzni na Fakulte designu a umenia v Ateliéri maľby u doc. Aleša Ogouna, akad. maliara. Je dvojnásobnou finalistkou súťaže mladých talentov Maľba – Cena Nadácie VÚB (2018, 2023).","Mladá autorka zachytáva vo svojej tvorbe rôzne polohy prírody, jej premeny a štruktúry. Cez detailnú maliarsku schopnosť a svojskú poetiku dokáže vtiahnuť ľudské oko a následne aj myseľ k existenciálnym úvahám. Lyrickým jazykom poukazuje na večné napätie a rozkol medzi (ne)bytím a bytím cyklu života. (A ten život a jeho kolobeh teda vie dobre byť a biť). Drobné kvetinky, rastliny ubité v priestore betónovej dlažby, túžiace po bytí a rozkvete. Cez tieto na prvý pohľad jednoduché zátišia chodníkovej a „predzáhradkovej“ estetiky nám maliarka ponúka priestor na zamyslenie, aká je veľkosť a sila prírody. V kombinácii so záujmom o „historický spôsob maľby“ patrí k súčasníkom „tekutej doby“, ktorí vytvárajú vlastné interpretácie reality. Krásy stále sa obnovujúcej vegetácie konfrontuje s postupne sa rozkladajúcim betónom pamätajúcim si časy dávno (režimové) minulé(?), čím je umocnený nostalgicko-dystopický jazyk autorkinej tvorby. Jej hľadanie krásy tam, kde by sme sotva našli, môžeme vnímať aj ako pomyselné hľadanie nádeje."],"refs":["https://www.instagram.com/dusana.vrbovska/. Odkaz nájdený 14. 10. 2026.","https://www.artbase.sk/product-tags/dusana-vrbovska/. Odkaz nájdený 14. 10. 2026."]}},"František Hrtús":{"en":{"head":"František Hrtús (1937–1997)","bio":["Hrtús is among the overlooked figures of Slovak art history. Orphaned as a child, he spent his early years in an orphanage. He began studying at the Academy of Fine Arts and Design in Bratislava but had to interrupt his studies for financial reasons and took employment as a miner in the Ostrava region. He later completed his education at the Faculty of Education in Trnava. He spent much of his life in Modra, where he also taught, before becoming a freelance artist in 1973.","He turned to realist landscape painting in the 1970s. The selection of paintings from the collection of the Kysuce Gallery in Oščadnica reveals this aspect of his practice, characterised by a close attention to modest details of the natural world."],"refs":["https://www.kysuckagaleria.sk/ (accessed 29 October 2026)."]},"sk":{"head":"František Hrtús (1937 – 1997)","bio":["Patrí k zabudnutým autorom domácich dejín umenia. Ako dieťa prišiel o oboch rodičov a svoje detstvo prežil v sirotinci. Študoval na Vysokej škole výtvarných umení v Bratislave, ale štúdium z finančných dôvodov prerušil a zamestnal sa ako baník na Ostravsku. Neskôr štúdiá dokončil na pedagogickej fakulte v Trnave. Značnú časť života prežil v Modre, kde pôsobil aj ako pedagóg a od roku 1973 pôsobil v slobodnom povolaní. Realistickej krajinomaľbe sa začal venovať v 70. rokoch 20. storočia. Vystavená kolekcia malieb zo zbierky KG v Oščadnici prezentuje jeho realistickú maliarsku polohu, kde sa autor zaujíma o jednoduché detaily z prírody."],"refs":["https://www.kysuckagaleria.sk/. Odkaz nájdený 29. 10. 2026."]}},"Ivona Žirková":{"en":{"head":"Ivona Žirková (1978)","bio":["Ivona Žirková studied at the Academy of Fine Arts and Design in Bratislava (1997–2003) in Professor Daniel Fischer’s studio. In 2001 she also studied painting under Professor Zdeněk Beran at the Academy of Fine Arts in Prague. Her practice is principally concerned with natural motifs, rendered in a (hyper)realist idiom. She received the Rector’s Prize at the Academy of Fine Arts and Design and won second prize in the VÚB Foundation Painting Award in 2006.","Žirková demonstrates a finely developed sensitivity to detail and texture. Her play between reality, illusion and abstraction depends on the viewer’s perception. Through optical effects, her paintings create impressions of movement, depth and ambiguity. The titles Layers and Layering themselves evoke strata of trees, branches, light and shadow. By concentrating on details, the artist breaks them down into structures. Her paintings are built from minute relationships and micro-layers. Their visual force derives from a compelling illusionism that simultaneously invites an abstract, non-realist reading of the image."],"refs":["www.gejdoszirkova.sk. Accessed 22 October 2026."]},"sk":{"head":"Ivona Žirková (1978)","bio":["Študovala na Vysokej škole výtvarných umení v Bratislave v rokoch 1997 – 2003 v ateliéri prof. Daniela Fischera, absolvovala štúdium maľby na Akadémii výtvarných umení v Prahe u prof. Zdeňka Berana (2001). Vo svojej tvorbe sa venuje najmä rôznym prírodným motívom, ktoré zobrazuje v (hyper)realistickom jazyku. Je držiteľkou Ceny rektora VŠVU a nositeľkou ceny Maľby nadácie VÚB (2. miesto) v roku 2006.","Žirková ukazuje svoj cit pre detail a štruktúru. Jej hra na pomedzí reality, ilúzie a abstrakcie je založená na diváckom vnímaní. Pomocou optickej ilúzie vytvára v maľbách dojem pohybu, hĺbky i nejednoznačnosti. Už samotné názvy diel <em>Vrstvy, Vrstvenie</em> pracujú z vrstvami (stromov, konárov, svetla a tieňov). Autorka vedome pracuje s detailom, čím ho rozkladá na štruktúry. Maľby a detaily v nich sú založené na minivzťahoch a mikrovrstvách. Údernosť jej tvorby je postavená na silnej iluzívnosti a súčasnom „abstraktnom/nerealistickom“ čítaní obrazu/maľby."],"refs":["www.gejdoszirkova.sk. Odkaz nájdený 22. 10. 2026."]}},"Jozef Jankovič":{"en":{"head":"Jozef Jankovič (1937–2017)","bio":["Jozef Jankovič was a leading Slovak sculptor and educator. He studied in Jozef Kostka’s studio at the Academy of Fine Arts and Design in Bratislava (1952–1956) and was an important participant in the Confrontations movement. Beyond sculpture, his practice encompassed drawing, experimental printmaking and jewellery. His work is distinguished by the deformed human figure and an engagement with experiences of unfreedom and human suffering. His numerous honours included the Grand Prix at the Danuvius Biennial in Bratislava (1968), an award at the Paris Biennale (1969) and the Herder Prize in Vienna (1983). He served as the Academy’s first rector following the Velvet Revolution (1990–1994), leaving an important artistic legacy.","Korean Motif belongs to the broader Korean Cycle (2006–2009), whose preparatory drawings date from the second half of the 1980s. Combining bronze and marble, the work engages with existential extremity, the denial of freedom and the experience of threat. Jankovič had connections with Korea: in 1987 he created a monumental sculpture for the Olympic Village in Seoul. His art is grounded in a powerful sense of the individual’s oppression within society, taking the human body – its deformation and fragmentation – as its point of departure. His works often articulate a longing, sometimes nostalgically unfulfilled, and the hope of a better world."],"refs":["BAJCUROVÁ, Katarína. Slovenské sochárstvo 1945–2015. Bratislava: Slovart, 2017. ISBN 978-8097-184-71-1."]},"sk":{"head":"Jozef Jankovič (1937 – 2017)","bio":["Bol popredný slovenský sochár, pedagóg. Študoval na Vysokej škole výtvarných umení v Bratislave (1952 – 1956) v ateliéri Jozefa Kostku. Bol významným členom Konfrontácií. Okrem sochárstva sa venoval aj kresbe, experimentálnej grafike, šperku. Pre jeho tvorbu je typická práca s deformovanou figúrou, reflektoval tiež pocity neslobody a ľudského utrpenia. Získal viacero ocenení: Grand Prix na bienále Danuvius v Bratislave (1968), ocenenie na Bienále mladých v Paríži (1969), Herderovu cenu vo Viedni (1983). Pôsobil ako prvý porevolučný rektor VŠVU (1990 – 1994). Zanechal po sebe hodnotné umelecké dielo.","Dielo <em>Kórejský motív</em> patrí k širšiemu <em>Kórejskému cyklu</em> ( 2006 – 2009), kresebná predloha cyklu vznikla v 2. polovici 80. rokov 20. storočia. Ide o kombináciu bronzu a mramoru. Autor diela pracoval s hraničným pocitom existencie, neslobody, ohrozenia. Jankovič mal väzby na Kóreu – v roku 1987 vytvoril monumentálnu sochu pre olympijskú dedinu v Soule. Jankovič vo svojej tvorbe vychádzal zo silne realistického pocitu útlaku jednotlivca v spoločnosti, reálne vychádzal z ľudského tela a jeho deformácie a fragmentácie. Jeho realizácie boli často o (nostalgicky nenaplnenej) túžbe, nádeji na lepší svet."],"refs":["BAJCUROVÁ, Katarína: <em>Slovenské sochárstvo 1945 – 2015</em>. Bratislava: Slovart, 2017, ISBN 978-8097-184-71-1."]}},"Jozef Srna st.":{"en":{"head":"Jozef Srna Sr (1930–1992)","bio":["Jozef Srna graduated from the Academy of Fine Arts and Design in Bratislava in 1957, having studied under Professors J. Želibský, P. Matejka and Ľ. Čemický. He was a notable representative of the new realist and hyperrealist tendencies of the 1970s and 1980s. In 1988 he received the Grand Prix at the Portrait Triennial in Liptovský Mikuláš.","His work focused principally on everyday urban and natural subjects, portraits and self-portraits. His realist paintings are distinguished by their meticulous observation of reality and profound emotional charge, often evoking a dreamlike atmosphere. They are deeply nostalgic, permeated by existential sorrow yet simultaneously offering an acceptance of that emotion and space for the small pleasures of life. Regarded as a solitary figure, Srna was unjustly overlooked for years in Slovak art history. His work was profoundly shaped by the political circumstances in which he lived. In retrospect, his painting might also be understood as a conscious retreat from the burdens of society."],"refs":["GAŽOVIČOVÁ, Nina. Jozef Srna: rodinný album (1981–1985). Bratislava: Soga Auction House, 2023. Photographs by Jozef Srna and Martin Deko Dökereš; translation by John Minahane. ISBN 978-80-89715-48-0."]},"sk":{"head":"Jozef Srna st. (1930 – 1992)","bio":["Vysokú školu výtvarných umení v Bratislave absolvoval v roku 1957 pod vedením prof. J. Želibského, P. Matejku, Ľ. Čemického. Patril medzi výrazných predstaviteľov novorealistických a hyperrealistických tendencií 70. a 80. rokov. Je držiteľom Grand prix Trienále portrétu v Liptovskom Mikuláši (1988).","Vo svojej tvorbe sa venoval najmä civilným, mestským a prírodným námetom, portrétom a autoportrétom. Pre jeho realistickú časť tvorby je príznačné precízne dokumentovanie reality s hlbokým emotívnym nábojom, ktorý často vyznieva snovo. Jeho diela pôsobia silne nostalgicky, sú pretkané existenciálnym smútkom a zároveň generujú pocit prijatia tejto emócie a vytvárajú priestor na možné prežívanie drobných radostí života. Bol považovaný za samotára a roky neprávom opomínaným autorom, na ktorého zabúdali domáce dejiny umenia. Jeho tvorbu silne poznačila politická doba, v ktorej žil. Jeho maliarsku stratégiu by sme s odstupom času mohli nazvať aj ako vedomým únikom od spoločenskej ťažoby."],"refs":["GAŽOVIČOVÁ, Nina. <em>Jozef Srna: rodinný album (1981<strong> – </strong>1985)</em>. Bratislava: Aukčná spoločnosť Soga, 2023. Fotografie Jozef Srna, Martin Deko Dökereš, preklad John Minahane. ISBN 978-80-89715-48-0."]}},"Jozef Suchoža":{"en":{"head":"Jozef Suchoža (1978)","bio":["Jozef Suchoža studied in the Sculpture – Surface – Space studio under Associate Professor Juraj Sapara at the Academy of Arts in Banská Bystrica. He graduated in 2003, completed his doctorate in 2010 and continues to teach at the Academy. His practice explores space, identity, memory, existence and spiritual themes.","At this exhibition, Suchoža presents Immaculatam (2018), a group of plaster replicas of the artist’s own figurine of the praying Immaculate Virgin Mary, derived from Immaculate (2016). In this work, the Virgin wears a black Muslim niqab in place of a white headscarf. The figure draws typologically on the work of Bartolomé Esteban Murillo. By altering this attribute of purity, the artist replaces the white veil with Muslim dress.","The sculptural object Altaussee? (2018) is an artistically manipulated copy of a Renaissance sculpture. It responds to modern historical events surrounding Michelangelo’s Madonna and Child, also known as the Madonna of Bruges (1501–1504). During the Second World War, the Nazis stole the sculpture and transported it to the salt mine at Altaussee in Austria, where it was reportedly at risk of destruction. It was subsequently found and rescued by an American military unit specialising in the recovery of looted artworks.","Suchoža’s Madonna has her face concealed by a veil (chador or niqab), a subtle yet emphatic response to iconoclasm. The white plaster copy stands on a black plinth. The work also includes a manipulated historical photograph documenting the sculpture’s rescue. For Suchoža, the work embodies a process of reassessment and subsequent purification, as well as rebirth, a new beginning and a renewed state of inviolability."],"refs":["https://art.aku.sk/diela/517/immaculatam. Accessed 22 October 2026.","https://art.aku.sk/diela/523/immaculate. Accessed 22 October 2026."]},"sk":{"head":"Jozef Suchoža (1978)","bio":["Jozef Suchoža študoval na Akadémii umení v Banskej Bystrici (pod vedením doc. Juraja Saparu) v ateliéri Socha – plocha – priestor. Štúdium ukončil v roku 2003, v roku 2010 ukončil doktorandské štúdium. Na akadémii doteraz pôsobí ako pedagóg. Jeho tvorba sa zaoberá priestorom, identitou, pamäťou, existenciou a duchovnými témami.","Na našej výstave sa predstavuje realizáciami: <em>Immaculatam</em> (2018) sú v sadre replikované (autorsky vytvorené) sošky modliacej sa nepoškvrnenej Panny Márie (z pôvodného diela <em>Immaculate</em>, 2016). Je to soška modliacej sa nepoškvrnenej Panny Márie, ktorá má na hlave namiesto bielej šatky čierny moslimský nikáb. Typologicky vychádza z diela Bartolomého Estebana Murilla. Sochárskou manipuláciou tohto atribútu čistoty nahrádza bielu šatku moslimským (čadorom) nikábom. Sochársky objekt <em>Altaussee?</em> (2018) predstavuje autorsky manipulovanú kópiu renesančnej sochy. V tejto práci reaguje na novodobé historické udalosti súvisiace so sochou <em>Madony s dieťaťom</em> alebo <em>Madony z Brúg</em> od Michelangela (1501 – 1504), ktorú počas druhej svetovej vojny ukradli nacisti a previezli do soľnej bane v rakúskom Altaussee, kde mala byť pravdepodobne zničená. Jednotka amerických vojakov špecializujúcich sa na záchranu ukradnutých umeleckých diel ju však našla a zachránila. „Suchožova madona“ má zakrytú tvár šatkou (čádor, nikáb), čím autor reaguje nenápadne a zároveň dôrazne na tému obrazoborectva. Biela sadrová kópia je osadená na čiernom podstavci. Súčasťou tohto diela je aj manipulovaná fotografia autentického záberu, ktorá zachytáva záchranu spomínaného diela. Suchoža chápe toto dielo ako stav: prehodnocovania a následnej očisty, ale i ako stav znovuzrodenia (nový začiatok) i novej nedotknuteľnosti."],"refs":["https://art.aku.sk/diela/517/immaculatam. Odkaz nájdený 22. 10. 2026.","https://art.aku.sk/diela/523/immaculate. Odkaz nájdený 22. 10. 2026."]}},"Julián Filo":{"en":{"head":"Julián Filo (1921–2007)","bio":["Julián Filo pursued a notably varied education. Between 1942 and 1944 he studied architecture at the Technical University in Vienna under Professor Gromm-Rottmayer. He subsequently attended the Academy of Fine Arts in Prague (1945–1946), studying with Professor K. Pokorný, before completing his training at the Department of Drawing and Painting of the Slovak University of Technology (1947–1949), under Professors Mudroch and Milly. In 2012 he was posthumously awarded the Fra Angelico Prize for his lifetime achievement.","A major Slovak painter, graphic artist and monumental artist, and a leading representative of New Figuration, Filo brought together influences from Pop Art, technology and the imagery of modern civilisation in a distinctive way. He was fascinated by design offices, everyday life, technological culture, consumer society and advertising. His works comment on the possibilities and contradictions of modern existence. Collage was a recurring principle in his practice. His smaller-scale works were presented in numerous solo and group exhibitions in Slovakia and abroad.","Both paintings in the exhibition date from the 1980s and depict people drawn into – and abruptly displaced from – the world of office life. Are they losing faith in their ideals?"],"refs":["https://www.gjk.sk/podujatie/julian-filo-filozofia-gesta (accessed 19 October 2026)."]},"sk":{"head":"Julián Filo (1921 – 2007)","bio":["Julián Filo absolvoval pomerne rozmanité štúdiá. V rokoch 1942 – 1944 študoval architektúru na Vysokej škole technickej vo Viedni (prof. Gromm-Rottmayer). Neskôr pokračoval v štúdiu na AVU v Prahe (1945 – 1946, prof. K. Pokorný). Štúdium dokončil na OKAM SVŠT (1947 – 1949, prof. Mudroch, prof. Milly). Za celoživotné dielo mu bola udelená cena Fra Angelico in memoriam v roku 2012.","Ako významný slovenský maliar, grafik, monumentalista a popredný predstaviteľ novej figurácie vo svojej tvorbe jedinečným spôsobom prepojil vplyvy pop-artu, sveta techniky a civilizmu. Fascinovalo ho prostredie projekčných kancelárií, civilný život, svet techniky, konzumnej spoločnosti a reklamy. Jeho realizácie sú komentárom možností sveta moderného človeka. Vo svojej tvorbe používal princíp koláže. Jeho komorná tvorba bola prezentovaná na mnohých individuálnych výstavách a kolektívnych prehliadkach doma a v zahraničí.","Oba obrazy na výstave pochádzajú z 80. rokov 20. storočia a sú zobrazením ľudí vtiahnutých a vytrhnutých „z office života“. Strácajú ilúzie o svojich ideáloch?"],"refs":["https://www.gjk.sk/podujatie/julian-filo-filozofia-gesta. Odkaz nájdený 19. 10. 2026."]}},"Marcel Mališ":{"en":{"head":"Marcel Mališ (1978)","bio":["Mališ studied in Professor Daniel Fischer’s Studio +- XXI at the Department of Painting and Other Media, Academy of Fine Arts and Design in Bratislava (2001–2007), and completed his doctorate in 2013. He has participated in dozens of solo and group exhibitions in Slovakia and abroad, including at the Slovak National Gallery (2009), the Neue Gesellschaft für Bildende Kunst in Berlin (2011) and the ESSL Museum in Austria (2013). His exhibitions include In Case Of, with Michaela Rázusová Nociarová (Gallery M++, Bratislava, 2007); Eastern Promises, with Róbert Bicek and Michal Černušák (GUDP, Brno, 2009); Tomáš Mališ Marcel Werner (Fru Fru Gallery, Bratislava, 2011); Life Is Beautiful (Čin Čin Gallery, Bratislava, 2013); MINIMÁLNE VŠETKO! (Flatgallery, Bratislava, 2014); ARBEIT JEDER ART (ATELIER XIII, Bratislava, 2016); and Z fondu (SODA Contemporary Art Gallery, Bratislava, 2018). His work has appeared in Vlna, Profil and Flash Art and is held in the collections of the Slovak National Gallery, Bratislava City Gallery, the Meullensteen Art Collection and other private collections. A three-time finalist for the VÚB Painting of the Year Award (2009, 2010 and 2011), he was also a finalist for the Henkel Art Award (2010) and received the ESSL Art Award CEE in 2013.","His practice centres on painting, with occasional forays into photography and objects.","The Lebensraum (living space) series is an extensive and ongoing body of realist paintings begun in 2009. It depicts heads suffocating beneath plastic shopping bags emblazoned with prominent brand names and logos. The bag becomes a metaphor for the pressures of consumerism, under which individuals lose both the space to breathe and their identities. The series critiques corporate dominance, consumption and the illusion of freedom of choice.","The straightforward, frontal compositions of these heads reflect a society governed by the compulsive consumption of a disorientated mass of consumers, voracious for goods, products, information, entertainment and experiences. Seduced by an endless array of choices, individuals ultimately become “products” themselves, approaching the final stage of their existence. There is so much of everything that breathing becomes impossible."],"refs":["https://www.marcelmalis.com/ (accessed 14 October 2026).","https://www.instagram.com/marcel_malis/ (accessed 14 October 2026)."]},"sk":{"head":"Marcel Mališ (1978)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave na Katedre maľby a iných médií v Ateliéry +- XXI u prof. D. Fischera (2001 – 2007). V roku 2013 dokončil doktorandské štúdium. Má za sebou niekoľko desiatok samostatných či skupinových výstav doma i v zahraničí, ako napr. v Slovenskej národnej galérii (2009), v Neue Gesellschaft für Bildende Kunst v Berlíne (2011) či v rakúskom ESSL Museum (2013). Výstavy: In case of spolu s Michaelou Rázusovou Nociarovou (Galéria M++, Bratislava, 2007), Eastern promises v spolupráci s Róbertom Bicekom, Michalom Černušákom (GUDP, Brno, ČR, 2009), Tomáš Mališ Marcel Werner (Fru Fru Gallery, Bratislava, 2011), Life is beautiful (Galéria Čin Čin, Bratislava, 2013), MINIMÁLNE VŠETKO ! (Flatgallery, Bratislava, 2014), ARBEIT JEDER ART (ATELIER XIII, Bratislava, 2016), Z fondu (Galéria súčasného umenia SODA, Bratislava, 2018). Za sebou má aj mnoho skupinových výstav. Jeho diela boli publikované v časopisoch Vlna, Profil, Flash art a sú zastúpené v zbierkach Slovenskej národnej galérie, Galérie mesta Bratislavy, Meullensteen Art Collection a v ďalších súkromných zbierkach. Je trojnásobným finalistom ceny VÚB Maľba roka (2009, 2010, 2011), finalistom ceny Henkel Art Award (2010) a laureátom ESSL Art Award CEE z roku 2013.","Vo svojej tvorbe sa venuje prevažne maľbe, sporadicky fotografii a objektom.","Cyklus <em>Lebensraum</em> (životný priestor) je už pomerne širokou kolekciou realistických malieb (neuzavretý cyklus vzniká od roku 2009), na ktorých už roky pracuje. Zobrazuje hlavy, ktoré sa dusia pod plastovými taškami s výraznou obchodnou značkou a logom (merchom). Plastová taška je metaforou na tlak konzumu, v ktorom človek stráca priestor na nádych i identitu. Celý tento cyklus je o kritike nadvlády korporácii, konzumu a o ilúzii slobodného výberu.","Jednoduchá kompozícia hláv v en face zobrazení je reflexiou spoločnosti, v ktorej prevláda psychotický konzum dezorientovanej masy spotrebiteľov – tovarov, produktov, informácií, zábavy a zážitkov. Jednotlivci, zvádzaní nekonečnou ponukou, sa napokon sami stávajú „produktmi“ v premortálnej fáze svojej existencie.","Všetkého je tak strašne veľa, až sa nedá dýchať."],"refs":["https://www.marcelmalis.com/. Odkaz nájdený 14. 10. 2026.","https://www.instagram.com/marcel_malis/. Odkaz nájdený 14. 10. 2026."]}},"Maroš Rovňák":{"en":{"head":"Maroš Rovňák (1972)","bio":["A visual artist who graduated in painting and fine art from the Academy of Fine Arts and Design in Bratislava (1996–2002), Rovňák explores queer identity and LGBTQ+ rights, as well as Western cultural attitudes towards death in their cultural and historical contexts. He works across a range of media, from photography and installation to video art, sound art, multimedia performance and painting.","In recent years, Rovňák has increasingly concentrated on painting. Through figurative compositions and portraits, he seeks to make the lived experiences of LGBTQ+ individuals visible. Innocence and gender ambiguity, together with isolation and vulnerability, become means of examining identity within social structures. He maintains that his work opens up a dialogue about the need for contemporary society to embrace diversity and authenticity. More broadly, these paintings address the experience of queer identity and the loneliness of individuals in hostile environments. Isolated figures are deliberately situated in melancholic landscapes, where their solitude becomes all the more pronounced. The presence of a fish as a silent, mute companion serves a dual purpose: it intensifies the sense of isolation while offering a glimmer of hope and inner understanding.","In these imaginatively rendered paintings of solitary young men, we recognise a powerful need to belong. Often this takes the form of longing for a world that does not exist, and perhaps never has, but which we nevertheless wish could exist. It is a complex mixture of loss, desire and the longing for acceptance…"],"refs":["https://marosrovnak.com/bio/ (accessed 30 September 2026).","https://www.saatchiart.com/en-sk/marosrovnak (accessed 30 September 2026)."]},"sk":{"head":"Maroš Rovňák (1972)","bio":["Vizuálny umelec a absolvent odboru maľby a výtvarného umenia na Vysokej škole výtvarných umení v Bratislave (1996 – 2002). Vo svojej tvorbe skúma témy queer identity a práv LGBTQ+ ľudí, ako aj postoje západnej kultúry k smrti v kultúrno-historickom kontexte. Pracuje s rozmanitými médiami, od fotografie a inštalácie až po videoart, zvukové umenie, multimediálnu performanciu a maľbu.","Maroš Rovňák sa za posledné obdobie vo svojej tvorbe upriamuje najmä na maľbu. Prostredníctvom figurálnych kompozícií a portrétov sa snaží zviditeľniť prežívanú skúsenosť LGBTQ+ jednotlivcov. Témy nevinnosti a rodovej nejednoznačnosti spolu s izoláciou a zraniteľnosťou mu slúžia ako prostriedok na skúmanie identity v rámci spoločenských štruktúr. Tvrdí, že jeho tvorba tak otvára dialóg o potrebe otvorenosti súčasnej spoločnosti voči rozmanitosti a autenticite. Tieto maľby vo svojej širšej koncepcii otvárajú tému prežívania queer identity a osamelosti jednotlivca v nepriateľskom prostredí. Izolované figúry sú zámerne zasadené do melancholických scenérií, kde ich opustenosť ešte výraznejšie vystupuje do popredia. Prítomnosť ryby ako tichého, nemého spoločníka funguje v dielach dvojakým spôsobom: zosilňuje pocit izolácie, no zároveň prináša lúč nádeje a vnútorného porozumenia.","V maliarsky imaginárne zobrazených osamelých mladíkoch chápeme silnú potrebu niekam patriť, často je to túžba po svete, ktorý neexistuje a možno ani nikdy neexistoval, ale túžime, aby predsa len bol. Je to zmes pocitov straty, túžby, akceptácie..."],"refs":["https://marosrovnak.com/bio/. Odkaz nájdený 30. 9. 2026.","https://www.saatchiart.com/en-sk/marosrovnak. Odkaz nájdený 30. 9. 2026."]}},"Martin Kochan":{"en":{"head":"Martin Kochan (1981)","bio":["Kochan studied at the Faculty of Education of Trnava University (2002–2007) and subsequently at the Faculty of Fine Arts of Brno University of Technology, in the studio of Associate Professor Michal Gabriel.","Early in his career, he pursued socially engaged art in public space, drawing inspiration from performance and action artists of the former Eastern Bloc. He understands art as an interplay of aesthetic, political and social perspectives and individual forms of expression. He collaborated closely with artists Cyril Blažo and Tomáš Beňadik. Humour and absurd, seemingly banal situations underpin part of his work. His practice is notably hybrid, ranging from photography and painting to conceptual interventions and sculpture.","In Star, Kochan questions the historical commissioning of artworks and the ideology embedded in symbols inherited from the past. Change of Articulation presents a hybrid anatomical figure whose body parts have been dislocated and exchanged. Once again, the artist responds critically to contemporary society and to the individual who functions mechanically, without feeling the need for deeper reflection."],"refs":["www.martinkochan.com (accessed 2 November 2026)."]},"sk":{"head":"Martin Kochan (1981)","bio":["Študoval na Pedagogickej fakulte Trnavskej univerzity (2002 – 2007), neskôr na Fakulte výtvarných umení na Vysokom učení technickom v Brne v ateliéri doc. Michala Gabriela.","V začiatkoch svojej tvorby sa venoval angažovanému umeniu vo verejnom priestore, inšpiráciou mu bola tvorba akčných umelcov východného bloku. Umenie vníma ako súbor estetických, politických a sociálnych hľadísk a individuálnych výstupov. Aktívne spolupracoval s umelcami Cyrilom Blažom a Tomášom Beňadikom. Časť jeho tvorby je postavená na humore a absurdných banálnych situáciách. Pre jeho tvorbu je príznačná hybridnosť (od fotografie cez maľbu a rôzne konceptuálne intervencie až po sochárske realizácie).","V soche <em>Hviezda</em> sa autor zaoberá kritikou historickej objednávky a ideológiou symbolov z minulosti. V <em>Zmene okĺbenia</em> rieši hybridnú anatomickú figúru s vykĺbenými a vymenenými časťami tela. Autor opäť kriticky reaguje na súčasnosť a jedinca, ktorý funguje mechanicky a nemá potrebu hlbšie sa zamyslieť."],"refs":["www.martinkochan.com. Odkaz nájdený 2. 11. 2026."]}},"Martina Rötling":{"en":{"head":"Martina Rötling (1987)","bio":["Martina Rötlingová was born in Bojnice in 1987 and has lived in Bratislava since childhood. She studied at the Academy of Arts in Banská Bystrica, initially under Professor Hodonský and subsequently under Professor Balko. She received the Martin Benka Award in 2022. She divides her time between Bratislava and Antwerp."],"refs":[]},"sk":{"head":"Martina Rötling (1987)","bio":["Martina Rötlingová (Bojnice 1987), od detstva žije v Bratislave. Študovala na Akadémii umení v Banskej Bystrici pod vedením prof. Hodonského, neskôr u prof. Balka. Je držiteľkou Ceny Martina Benku (2022). Striedavo žije v Bratislave a v Antverpách."],"refs":[]}},"Michaela Rázusová Nociarová":{"en":{"head":"Michaela Rázusová Nociarová (1976)","bio":["Rázusová Nociarová studied at the Academy of Fine Arts and Design in Bratislava (1994–2008 / 2000–2003) under Professor Daniel Fischer. She completed her doctoral studies in 2009 under Professor Ján Berger and teaches at the Josef Vydra School of Applied Arts in Bratislava.","Water, in its many variations, is a central theme in Michaela Rázusová Nociarová’s work. Swimsuits and Jump explore swimming, the water’s surface and immersion. For the artist, water offers a space for reflection in which the boundaries between reality and imagination become blurred. Her paintings capture swimmers’ bodies, and fragments of bodies, in motion within water. She approaches the act of jumping into water as a process of transformation and submersion. Her treatment of aquatic motifs and surfaces is thus at once conceptual and nostalgic."],"refs":["https://www.instagram.com/michaela_razusova/ (accessed 2 November 2026).","https://www.saatchiart.com/en-sk/account/artworks/87425 (accessed 2 November 2026)."]},"sk":{"head":"Michaela Rázusová Nociarová (1976)","bio":["Vyštudovala Vysokú školu výtvarných umení v Bratislave (1994 – 2008 / 2000 – 2003) pod vedením prof. Daniela Fischera. Doktorandské štúdium ukončila v roku 2009 pod vedením prof. Jána Bergera. Pôsobí ako pedagogička na Škole umeleckého priemyslu Josefa Vydru v Bratislave.","Veľkou témou v tvorbe Michaely Rázusovej Nociarovej je voda a rôzne variácie na ňu. Maľby <em>Plavky</em> a <em>Skok</em> sú o plávaní, vodnej hladine, ponáraní sa. Voda pre ňu predstavuje priestor pre reflexiu, stieranie medzi realitou a fantáziou. Obrazy zachytávajú telá plavcov a ich fragmenty v pohybe – vo vode. Skok do vody spracovala ako proces zmeny, ponoru. Vodné motívy/hladiny tak vytvára doslovne konceptuálne a nostalgicky zároveň."],"refs":["https://www.instagram.com/michaela_razusova/. Odkaz nájdený 2. 11. 2026.","https://www.saatchiart.com/en-sk/account/artworks/87425. Odkaz nájdený 2. 11. 2026."]}},"Michal Mráz":{"en":{"head":"Michal Mráz (1987)","bio":["Michal Mráz initially studied sculpture at the Academy of Fine Arts and Design in Bratislava (2007–2009), in the Sculpture, Object and Installation Department, in the studio of J. Meliš and J. Hoffstädter. Painting, however, is the medium in which he feels most at home. His work has resonated more strongly internationally than within the Slovak art scene. He was nominated for the Artaq Urban Art Award in 2012 and was a finalist in the Saatchi Online Showdown in 2013.","The hybrid character of his painting frequently draws on various retro aesthetics, while also incorporating a distinctly contemporary sense of things literally running or melting away. Memories and their nostalgia for the future appear to dissolve across his canvases. Through imagery borrowed from the past, he reflects on the speed and chaos of the present, suggesting that the mustiness of bygone times pales beside the stench of contemporary life.","Crash presents an “almost” perfect family scene – if only... A couple standing somewhere outside a house in the mountains seem to melt effortlessly beside a motor vehicle whose journey has ended in a wreck. The sudden realisation that the car has crashed lends a new dimension to the blurred, ephemeral painted figures, who appear less like people than “departing souls”.","The second painting in the exhibition, House of Card, depicts a house built from payment cards. This pyramid of cards dominates the composition more than the human figure – a woman relegated to the background, seemingly searching by hand for “something” in a card index. The card pyramid appears almost as a reflection of her searching mind."],"refs":["VLACHOVÁ, Dorota (ed.). MICHAL MRÁZ. Bratislava: Slovart, 2020. ISBN 978-80-556-4569-8.","https://www.instagram.com/michalmraz/ (accessed 14 October 2026)."]},"sk":{"head":"Michal Mráz (1987)","bio":["Michal Mráz pôvodne študoval v sochárskom ateliéri na Vysokej škole výtvarných umení (2007 – 2009) na Katedre Socha, objekt, inštalácia, ateliér sochy J. Meliša a J. Hoffstädtera. Bezprostrednejšie sa však cíti v médiu maľby. Jeho tvorba rezonuje viac v medzinárodnom prostredí, než v domácom umeleckom kontexte. V roku 2012 bol nominovaný na cenu Artaq Urban Art Award a v 2013 bol finalistom Saatchi online Showdown.","Jeho hybridná povaha maľby často čerpá z rôznych retro estetík, ale zároveň v sebe nesie prvky súčasnej „stečenosti“, a to doslovne. Na plátnach akoby sa zámerne rozpíjali spomienky a ich nostalgia za budúcnosťou. Cez vizuálne obrazy čerpajúce z minulosti uvažuje o rýchlosti a chaose dnešných dní a súčasne nám jasne naznačuje, že stuchlina minulosti ani náhodou nemá takú silu ako ten smrad súčasnosti.","V maľbe <em>Crash</em> zachytáva „skoro“ dokonalý rodinný výjav, keby... Pár, stojaci niekde pred domom v horách, sa s tušenou ľahkosťou bytia rozteká pri motorovom vozidle, ktoré už dojazdilo, lebo je na „šrot“. Náhle uvedomenie, že auto je po havárii, dáva nový rozmer rozmazanosti/efemérnosti maľovaných postáv, ktoré sa už nejavia ako postavy, ale skôr ako „odchádzajúce duše“...","Druhý obraz na výstave je domčekom z platobných kariet <em>House of Card</em>. Pyramída z platobných kariet dominuje obrazu viac ako ľudská bytosť (žena), ktorá akoby bola v pomyselnom druhom pláne obrazu, manuálne hľadajúca „niečo“ v kartotéke. Pyramída z kariet, akoby bola myšlienkovým odrazom hľadajúcej..."],"refs":["VLACHOVÁ, Dorota (eds.): <em>MICHAL MRÁZ</em>. Bratislava: Slovart, 2020, ISBN 978-80-556-4569-8.","https://www.instagram.com/michalmraz/. Odkaz nájdený 14. 10. 2026."]}},"Michal Černušák":{"en":{"head":"Michal Černušák (1982)","bio":["Černušák studied in Professor Ivan Csudai’s Studio 4 at the Academy of Fine Arts and Design in Bratislava (2001–2007), completing his doctoral studies in the same studio in 2011. He teaches at the Academy and heads its Department of Painting.","Working on a monumental scale, Černušák responds to the media-saturated world, the spheres of management and politics, and the urban environment. Using spray-painting techniques, he constructs catastrophic scenarios in imaginary cities, giving form to the anxieties of a contemporary subject who harbours few illusions about the exercise of power. Corporate symbols and structures of authority become objects of painterly critique, lending aspects of his practice an implicitly political character. His canvases evoke a distinctive, nostalgic melancholy. The contemporary world emerges as an unstable space, already transformed into memory within the image.","Through airbrushing and halftone patterns, Černušák draws on retro aesthetics to conjure memories of events yet to come – a nostalgia for the future. He paints the people, or ghosts, of our lost tomorrows. Nostalgia becomes a blurred recollection, echoed by the softened contours of his airbrush technique. Mist and smog provide a visual equivalent of lost time. This materialised psychological blurring is therefore not merely an environmental critique but a visual filter through which nostalgia is experienced. What was meant to be our technological future dissipates like a cloud of vapour, leaving only a melancholic residue upon the psyche and the ruins of our own present."],"refs":["https://www.instagram.com/michal_cernusak/ (accessed 2 November 2026)."]},"sk":{"head":"Michal Černušák (1982)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave v 4. ateliéri prof. Ivana Csudaia (2001 – 2007). Doktorandské štúdium ukončil v roku 2011 v tom istom ateliéri. Pôsobí ako pedagóg a vedúci Katedry maľby na VŠVU.","Černušák pracuje s veľkoformátovými maľbami, reaguje na mediálny svet, zároveň reflektuje na svet manažérov, politikov a na prostredie mesta. Maľuje katastrofické scenáre imaginárnych miest pomocou striekacej pištole, pracuje s napätím súčasníka, ktorý si v útrobách svojho mozgu nerobí žiadne ilúzie o súčasnom svete a jeho moci riadenia a vedenia. Symboly korporácií a mocenských štruktúr podrobuje maliarskej kritike, čím časť jeho tvorby môžeme nepriamo nazvať ako angažovanú. Jeho plátna vyvolávajú istý druh (nostalgickej) melanchólie. Černušák maľuje súčasný svet ako nestabilný priestor, ktorý je v obraze už iba spomienkou. Použitím airbrushu a rastrov pracuje s retro estetikou, čím vytvára spomienku na niečo, čo sa stane – vytvára nostalgiu za budúcnosťou. Maľuje ľudí/duchov našich stratených zajtrajškov. Nostalgiu vníma ako rozostrenú spomienku (rozostrená maliarska technika airbrushu). Černušák vytvára vizuálny ekvivalent strateného času cez estetiku hmly a smogu. Materializované psychologické rozostrenie tak nie je len environmentálnou kritikou, ale aj vizuálnym filtrom nostalgie. Čo malo byť našou technologickou budúcnosťou, sa rozplýva ako oblak z pary, a zostáva nám len melancholický sediment na duši a (z)rúcaniny vlastnej prítomnosti."],"refs":["https://www.instagram.com/michal_cernusak/. Odkaz nájdený 2. 11. 2026."]}},"Milan Bočkay":{"en":{"head":"Milan Bočkay (1946)","bio":["One of the most respected figures in Slovak visual art, Milan Bočkay was strongly influenced during his studies by Professor Rudolf Fila. He graduated from the Academy of Fine Arts and Design in Bratislava, where he studied under Professors Dezider Milly and Peter Matejka. For many years he taught at the Josef Vydra School of Applied Arts in Bratislava.","Bočkay’s artistic language is grounded in a meticulous investigation of optical illusion, particularly the technique of trompe-l’œil. He frequently engages with art history, reinterpreting works by major artists such as Michelangelo, Leonardo da Vinci, van Gogh, Mondrian and Fila. By seemingly covering these images with layers of paper, he places them in new contexts: he creases them illusionistically or supplements them with his own commentary, opening up fresh readings. A member of the A-R artists’ group, he repeatedly depicts tears, folded paper, adhesive tape, string and textile textures, creating extraordinarily convincing painted and drawn imitations. His work advances the proposition that every painting or drawing is, fundamentally, an illusion. Yet this does not make him a conventional realist: his approach is conceptual, probing the relationships between surface and space, light and shadow, and the real and the represented."],"refs":["https://nitrianskagaleria.sk/bockay-milan-stvorec-v-priestore/#o-diele (accessed 30 October 2026).","VALOCH, Jiří; FILA, Rudolf; ZAJAC, Peter. Milan Bočkay. Prešov: Vydavateľstvo Michala Vaška, 2005. Photographs by Martin Marenčin. ISBN 8888000084185."]},"sk":{"head":"Milan Bočkay (1946)","bio":["Patrí k rešpektovaným autoritám slovenského vizuálneho umenia, počas štúdia mal veľký vplyv na autora – prof. Rudolfa Filu. Vysokú školu výtvarných umení v Bratislave absolvoval u prof. Dezidera Millyho a Petra Matejku. Roky pôsobil ako pedagóg na Škole úžitkového výtvarníctva Josefa Vydru v Bratislave.","Jeho umelecký jazyk je postavený na detailnom skúmaní optických klamov, využíva techniku trompe l´oeil. Často pracuje s témami z dejín umenia, (re)interpretuje diela velikánov (napr. Michelangelo, da Vinci, van Gogh, Mondrian, Fila a ďalší). Prekrýva ich/intervenuje do nich vrstvami papiera, čím ich dostáva do nových kontextov a súvislostí, krčí ich (v iluzívnom zmysle) alebo ich dopĺňa o vlastné komentáre, tým vznikajú nové interpretácie. Je členom výtvarnej umeleckej skupiny A-R. Často maľuje trhliny, záhyby papiera, lepiace pásky, špagáty, štruktúru textilu... Vytvára ilúziu dokonalej maliarskej/kresliarskej imitácie. Bočkay deklaruje svojou tvorbou tvrdenie, že každá maľba/kresba je v podstate ilúziou, čo ho neradí to polohy tradičného „realistického tvorcu“, pretože pracuje konceptuálne – skúma vzťah medzi plochou a priestorom, svetlom a tieňom, reálnym a zobrazeným."],"refs":["https://nitrianskagaleria.sk/bockay-milan-stvorec-v-priestore/#o-diele. Odkaz nájdený 30. 10. 2026.","VALOCH, Jiří – FILA, Rudolf – ZAJAC, Peter. <em>Milan Bočkay</em>. Prešov: Vydavateľstvo Michala Vaška, 2005. Fotografie Martin Marenčin. ISBN 8888000084185."]}},"Miloš Šimurda":{"en":{"head":"Miloš Šimurda (1924–2019)","bio":["Miloš Šimurda was an important Czech painter, draughtsman, monumental artist, teacher and poet. His work had a profound influence on Slovak visual art, particularly during the 1960s. He studied at the Academy of Fine Arts and Design in Bratislava under Professor Ján Mudroch and subsequently attended the School of Mosaic in Ravenna. In 1989 he joined an international association of contemporary mosaic artists. He collaborated closely with the prominent Slovak architect Emil Belluš on architectural projects. He taught at the Secondary School of Applied Arts in Bratislava (1957–1958) and the Faculty of Civil Engineering at the Slovak Technical University (1963–1965).","During the period of Normalisation following 1968, Šimurda was excluded from official public artistic life. Subject to political pressure, he was unable to return to the art scene until after 1989. For almost twenty years he worked in isolation, without opportunities for solo or group exhibitions, and was also cut off from state commissions connected with architecture.","Passenger and Situation No. 2 are characteristic examples of his work from the turn of the 1960s and 1970s, when he experimented with assemblage and oil painting. He incorporated unconventional industrial materials, including Plexiglas and sheet metal, into his compositions. These figurative works reflect on modern humanity, mobility and machinery. Figures and objects inhabit extreme situations that combine elements of modern industrial civilisation, abstraction and artistic experimentation."],"refs":["RUSINOVÁ, Zora. Slovenské vizuálne umenie 1970–1985. Bratislava: Slovak National Gallery, 2002. ISBN 80-8059-073-7."]},"sk":{"head":"Miloš Šimurda (1924 – 2019)","bio":["Bol významný český maliar, kresliar, monumentalista, pedagóg a básnik. Svojou tvorbou zásadne ovplyvnil slovenské výtvarné umenie najmä v 60. rokoch 20. storočia. Študoval na Vysokej škole výtvarných umení v Bratislave pod vedením prof. Jána Mudrocha. Neskôr študoval na Škole mozaiky v Ravenne. V roku 1989 sa stal členom medzinárodnej asociácie moderných mozaikárov. V oblasti architektúry úzko spolupracoval s popredným slovenským architektom Emilom Bellušom. Pôsobil ako pedagóg na Strednej umeleckej priemyselnej škole v Bratislave (1957 – 1958) a na Stavebnej fakulte SVŠT (1963 – 1965). V období normalizácie (po roku 1968) bol vylúčený z oficiálneho verejného umeleckého života. Čelil politickému tlaku, na scénu sa vrátil až po roku 1989. Takmer 20 rokov tvoril v ústraní bez možnosti samostatne či skupinovo vystavovať. Bol odstrihnutý aj od štátnych zákaziek súvisiacich s architektúrou.","Diela <em>Spolujazdec</em> a <em>Situácia č. 2</em> sú typickým príkladom Šimurdovej tvorby z prelomu 60. a 70. rokov, kde autor experimentoval s technikou asambláže a olejomaľby. Do kompozície zakomponoval netradičné priemyselné materiály ako plexisklo a plech. Tieto figurálne kompozície reflektujú moderného človeka, mobility, stroje. Postavy a objekty situuje do hraničných situácií, ktoré nesú v sebe prvky civilizmu, abstrakcie a autorského experimentu."],"refs":["RUSINOVÁ, Zora: <em>Slovenské vizuálne umenie 1970 – 1985</em>. Bratislava: Slovenská národná galéria, 2002, ISBN 80-8059-073-7."]}},"Miro Trubač":{"en":{"head":"Miro Trubač (1986)","bio":["Miro Trubač studied in Professor Patrik Kovačovský’s Sculpture, Object and Installation studio at the Academy of Fine Arts and Design in Bratislava (2005–2011). He subsequently completed his doctoral studies at the same institution (2016–2021).","Discussing his work, Trubač describes Ján, Adolescence as a significant moment of introspection and interpretation of personal experience, bound up with memories of childhood and adolescence, when his understanding of lived reality was taking shape. It recalls a shared experience with a respected individual and the lessons drawn from it. This may help explain his recurring interest in male figures and activities. His work is permeated by doubt and the attempt to resolve it through giving form to experience in material.","Underdog and Fall / Went Down belong to the White Man series (2022–2023), in which Trubač employs a prototype figure from the Poser software package, used to create digital characters. He deliberately selected a figure presented by the programme as a standard ‘white man’. Just as earlier periods established canons of ideal bodily beauty, digital software now offers its own models. Trubač is fascinated by this comparable idealising aesthetic and by its typological treatment of ethnicity — in this instance, the white male body.","The White Man series comprises twelve figures, which symbolically register the passage of time and articulate an individual’s psychological experience: victories, falls and failures. Together, they form a kind of self-portrait, a sculptural projection of the artist’s inner life. The number twelve evokes the months of the year and the twelve apostles. The series also recalls the expressive studies of Franz Xaver Messerschmidt.","The term ‘underdog’ describes someone expected to lose, or a person disadvantaged by social, economic or political inequalities. Here it evokes ‘someone who always willingly takes the punishment’: a figure repeatedly burdened by life, yet prepared to endure another round.","‘What went down’ is a colloquial way of asking what happened in a particular situation, often introducing an account of an unexpected sequence of events. In Trubač’s work, it refers to the bizarre scenario of a dolphin attacking a person. The incident becomes a metaphorical fall: a knockout blow in boxing, followed by collapse."],"refs":["www.mirotrubac.net. Accessed 28 October 2026."]},"sk":{"head":"Miro Trubač (1986)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave v Ateliéri sochy, objektu a inštalácie pod vedením prof. Patrika Kovačovského (2005 – 2011). Na tej istej škole absolvoval doktorandské štúdium (2016 – 2021).","O svojich dielach bližšie hovorí, že napr. v diele <em>Ján, dospievanie</em> ide o dôležitý moment introspekcie a interpretácie vlastnej skúsenosti, spojenej so spomienkami na detstvo a dospievanie, keď sa rozvíjalo autorovo myslenie vo vzťahu k žitej realite. Spoločný zážitok s váženou osobou a poučenie sa z tejto skúsenosti. Toto je pravdepodobne jeden z motívov, prečo pracuje s mužskými postavami a aktivitami. Trubačova tvorba je pretkaná motívmi pochybností a ich objasňovania oživovaním v materiáli.","Diela <em>Smoliar/Underdog</em> a <em>Pád/Went down</em> sú zo série <em>Biely muž</em> (2022 – 2023), v ktorej autor využíva prototyp figúry z programu Poser. Poser sa používa pri programovaní hier na utváranie charakteru. Zámerne vybral figúru z galérie programu, ktorá je prototypom „bieleho muža“. Ako v minulosti existoval kánon ideálu krásy pre zobrazenie ľudského tela, to isté ponúka aj daný program. Fascinuje ho podobná estetika ideálu, typologický charakter pre etnikum. V Trubačovom prípade je to biely muž. V sérii <em>Biely muž</em> (12 figúr, na výstave je jedna z nich), ktorá symbolizuje čas, zachytil psychologické prežívanie jednotlivca (víťazstvá, pády, zlyhania). Ide o súbor 12 bielych mužských postáv, ktoré predstavujú „autoportrét“ – plastickú projekciu autorovho vnútorného a psychologického prežívania. Ich počet symbolicky odkazuje na plynutie času, mesiace či dvanástich apoštolov. Podobne ako F. X. Messerschmidt vo svojich autoportrétoch.","Pojem „underdog“ označuje jednotlivca, u ktorého existuje pravdepodobnosť prehry na vyššej úrovni. Tento výraz môže tiež označovať osobu znevýhodnenú systémom v dôsledku sociálnej, ekonomickej alebo politickej nerovnosti. „Človek, ktorý si vždy dobrovoľne všetko odskáče.“ Život mu nakladá a on je ochotný dobrovoľne držať a znášať ďalšie kolo...","„What went down“ je slangové vyjadrenie pre otázky „Čo sa stalo?“ alebo „Čo sa stalo v danej situácii?“. Používa sa pri opisovaní prekvapivej série udalostí. Slúži na uvedenie príbehu alebo opisu toho, ako k určitej udalosti či situácii došlo. V Trubačovom prípade ide o bizarný opis situácie, keď zasiahol delfín a napadol človeka. Symbolizuje to pomyselný pád. K.O. úder v boxe a následný kolaps z otrasu."],"refs":["www.mirotrubac.net. Odkaz nájdený 28. 10. 2026."]}},"Miroslav Sandanus":{"en":{"head":"Miroslav Sandanus (1992)","bio":["He completed a master’s degree in the Open Painting Studio led by Rastislav Podoba at the Academy of Arts in Banská Bystrica. He has participated in numerous successful solo and group exhibitions, primarily in Slovak cities including Rajecké Teplice, Bratislava, Banská Štiavnica, Trenčín and Nitra. His work has also been presented internationally in group exhibitions in Paris and Venice. He was a finalist for the Painting of the Year award in 2021 and 2022, having placed third in 2020. In 2022 he received the Martin Benka Award, and in 2024 he won first prize in the Painting of the Year competition for his painting SAFE.","The two paintings from the larger Illusions series respond to the influence of algorithms on contemporary everyday life. As the artist explains: “Individuals do not form relationships with one another and consequently lose touch with the world around them. It is a metaphor for the present day, in which individualism prevails and people lose contact with each other. I am also referring to social media, where algorithms cause people to live in their own ‘bubbles’.”","In the Apathy series, Sandanus draws attention to the damaging effects of hyperconsumerism on people and the natural world. Throughout his practice, he reflects on environmental issues, social crises and the impact of technology on the psychological experience of individuals and society."],"refs":["https://sandanus.art/bio/ (accessed 1 October 2026)."]},"sk":{"head":"Miroslav Sandanus (1992)","bio":["Absolvent magisterského stupňa Otvoreného ateliéru maľby u Mgr. art. Rastislava Podobu, ArtD. na AU v Banskej Bystrici. Má za sebou rad úspešných samostatných a kolektívnych výstav prevažne v slovenských mestách, akými sú Rajecké Teplice, Bratislava, Banská Štiavnica, Trenčín, Nitra a mnohé iné. Svoju tvorbu predstavil i v zahraničí na kolektívnych prehliadkach v Paríži či Benátkach. V rokoch 2022, 2021 bol finalistom súťaže Maľba roka a v roku 2020 sa umiestnil na 3. mieste. V roku 2022 sa stal laureátom ceny Martina Benku a nakoniec získal v roku 2024 prvé miesto v súťaži Maľba roka s obrazom <em>SAFE</em>.","Dvojica obrazov z väčšieho cyklu <em>Ilúzie</em> je autorovou reakciou na vplyv algoritmov v bežnom užívateľskom živote súčasného človeka. „Subjekty si nevytvárajú vzťahy medzi sebou, a dôsledkom toho strácajú kontakt s okolitým svetom. Ide o metaforu na súčasnú dobu, kde prevláda individualizmus a ľudia strácajú kontakt medzi sebou. Taktiež odkazujem na sociálne siete, kde skrz algoritmy ľudia žijú vo svojich ,bublináchʻ.“","V cykle <em>Apatia</em> Sandanus poukazuje na negatívny vplyv hyperkonzumu na človeka a prírodu. V celej autorovej tvorbe vidíme reflexiu environmentálnych tém, spoločenských kríz a dosah technológií na psychické prežívanie jednotlivca a spoločnosti."],"refs":["https://sandanus.art/bio/. Odkaz nájdený 1. 10. 2026."]}},"Pavol Stručka":{"en":{"head":"Pavol Stručka (1981)","bio":["Pavol Stručka studied painting at the Academy of Fine Arts and Design in Bratislava (1999–2005) under Professor Ján Berger. He teaches at the Secondary School of Art in Hodonín.","Stručka frequently draws on the subjects and conventions of classical painting, including the Renaissance, Neoclassicism and Romanticism, while introducing contemporary, sometimes surreal, elements. These lend his works a dreamlike quality and open them to multiple interpretations. Working primarily in oils, he brings past and present together through portraits, figures and landscapes. His paintings do not belong to any single dominant movement; rather, they portray individuals and the stories of their lives. He looks to the painterly tradition, appropriating and reflecting upon it in his own practice.","A powerful sense of faith and hope permeates his distinctive work. Melancholy and existential stillness are equally central to his visual language. This atmosphere is not incidental, but arises from his artistic programme: a return to classical painting and the legacy of the Old Masters. Melancholy may also be understood as the preserve of thinkers and contemplative individuals. His figures often appear motionless or absorbed in thought. In Stručka’s work, melancholy is neither depression nor despair; it is an aesthetic category, a noble sadness, a moment of quietude and a search for deeper meaning amid the haste of modern life. His paintings carry within them a nostalgia for the future."],"refs":["https://www.instagram.com/pavol_strucka/. Accessed 29 October 2026."]},"sk":{"head":"Pavol Stručka (1981)","bio":["Študoval na Vysokej škole výtvarných umení v Bratislave (1999 – 2005) v ateliéri maľby prof. Jána Bergera. Pedagogicky pôsobí na Strednej umeleckej škole v Hodoníne.","Stručkova tvorba často námetovo vychádza z klasickej maľby (renesancia, klasicizmus, romantizmus), je však doplnená o „súčasné (sur)reálie“, čo jej dodáva snový rozmer a možno jeho tvorbu rôzne interpretovať. Autor sa venuje najmä olejomaľbe, ktorá spája minulosť so súčasnosťou. Témou jeho malieb je portrét, figúra, krajina. Stručkova maľba nepatrí do žiadneho výrazného maliarskeho prúdu, zachytáva človeka s jeho príbehom počas života. Vzhliada k tradícii maľby, aby ju následne sám vo svojej tvorbe použil a reflektoval. V jeho autentickej tvorbe je prítomný silný duch viery a nádeje, čím je tento spôsob divácky atraktívny. Ďalej je to melanchólia a existenciálne ticho – ústredné kategórie formujúce vizuálny jazyk maliara Pavla Stručku. Táto nálada nie je v jeho tvorbe náhodná, ale priamo vychádza z jeho umeleckého programu – návratu ku klasickej maľbe a k odkazu starých majstrov. Melanchóliu môžeme vnímať aj ako výsadu mysliteľov, hĺbavých ľudí. Postavy na jeho plátnach sú často zachytené v stave nehybnosti či hlbokého zamyslenia. Melanchólia v Stručkovom podaní nie je depresiou alebo beznádejou. Je to estetická kategória – vznešený smútok, stíšenie sa a hľadanie hlbšieho zmyslu uprostred uponáhľaného moderného sveta. Je to maľba, ktorá nesie v sebe nostalgiu za budúcnosťou."],"refs":["https://www.instagram.com/pavol_strucka/. Odkaz nájdený 29. 10. 2026."]}},"Peter Daniš":{"en":{"head":"Peter Daniš (1983)","bio":["Peter Daniš studied at the Academy of Fine Arts and Design in Bratislava under Professor Ján Berger (2002–2008). He exhibits regularly in Slovakia and internationally, and was a finalist for the BBA Artist Prize in 2024.","His paintings occupy a threshold between atmospheric landscape, aerial views, nocturnal scenes and abstractions of light. He frequently reduces the landscape to horizons, luminous strata, haze and distant forms, deliberately capturing the fleeting moments produced by light and its transformations. He generally works in series, presenting urban horizons and cityscapes from shifting viewpoints.","The triptych Horizon conveys the expanse of a landscape seen from above, where light meets silence. A radiant horizon unfolds into deep atmospheric layers, offering a vision of airiness and transience suspended in brightness.","In Factory, fragments of industrial structures recede into the vastness of the horizon and dissolve into luminous haze. Monumental clouds dominate the composition, while light itself becomes the central object of fascination.","Lightscape continues the artist’s long-standing exploration of nocturnal urban scenes, tracing a quiet, gradual passage from darkness into radiance."],"refs":["https://danispeter.sk/ (accessed 15 October 2026)."]},"sk":{"head":"Peter Daniš (1983)","bio":["Peter Daniš študoval na Vysokej škole výtvarných umení v Bratislave (2002 – 2008) pod vedením prof. Jána Bergera. Pravidelne vystavuje doma i v zahraničí. V roku 2024 sa stal finalistom ceny BBA Artist Prize.","Pre jeho maľby je príznačné, že sa pohybujú na pomedzí atmosférických krajinomalieb, pohľadov z vtáčej perspektívy, nočných scenérií a svetelných abstrakcií, pričom autor krajinu často redukuje na horizonty, vrstvy svetla, opary a vzdialené tvary. Cielene zachytáva prchavé momenty, ktoré prináša svetlo a práca s ním. Najčastejšie tvorí v maliars
